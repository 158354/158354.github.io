  if(S.activeClubTask && S.activeClubTask.club===clubName){
    S.activeClubTask.progress++;
    if(S.activeClubTask.progress>=S.activeClubTask.need){
      const t=S.activeClubTask;
      taskPart=`\n\n📋 社团任务「${t.n}」完成！`;
      if(t.reward&&t.reward.skill){addSkill(t.reward.skill,t.reward.v);affChanges.push({label:`任务奖励：${t.rewardText}`,dir:'up'});}
      if(t.reward&&t.reward.base){addBase(t.reward.base,t.reward.v);affChanges.push({label:`任务奖励：${t.rewardText}`,dir:'up'});}

/* ===== 按任务类型给附加奖励 ===== */
if(t.type==='social'){
  const ally=S.npcs.filter(n=>n.club===clubName && n.known)[0];
  if(ally){ ally.aff=clamp(ally.aff+3,0,100); affChanges.push({label:`${ally.name} 好感 +3`,dir:'up'}); }
  S.mood=clamp(S.mood+12,0,100);
  affChanges.push({label:'心情 +12',dir:'up'});
}else if(t.type==='creative'){
  addBase('才艺',1);
  affChanges.push({label:'才艺 +1',dir:'up'});
  S.mood=clamp(S.mood+10,0,100);
  affChanges.push({label:'心情 +10',dir:'up'});
}else{
  addBase('情商',1);
  affChanges.push({label:'情商 +1',dir:'up'});
  S.mood=clamp(S.mood+8,0,100);
  affChanges.push({label:'心情 +8',dir:'up'});
}

addEvent(`📋 完成社团任务「${t.n}」！${t.rewardText}。`,'good');
      S.clubTaskHistory.push({...t,done:true});
      S.activeClubTask=null;
    }else{
      taskPart=`\n\n📋 社团任务进度：${S.activeClubTask.progress}/${S.activeClubTask.need}`;
      affChanges.push({label:`任务进度 ${S.activeClubTask.progress}/${S.activeClubTask.need}`,dir:'up'});
    }
  }

  const body=`${detail}\n\n${act.d}${npcPart}${taskPart}`;
  const after=snapshot();
  const changes=diffStats(before,after).concat(affChanges);
  gotoScene(`${data.icon} ${clubName} · ${act.n}`,body,changes,()=>exitClubActivity());
}

/* ===== 退出社团：确认 + 剧情 ===== */
function openQuitClub(clubName){
  if(!S.player.clubs.includes(clubName)) return;
  const isMinister = !!(S.player.clubRole && S.player.clubRole.club===clubName && S.player.clubRole.role==='负责人');
  const ministerNpc = S.npcs.find(n=>n.role==='社团负责人' && n.club===clubName && n.known);
  const hasTask = S.activeClubTask && S.activeClubTask.club===clubName;

  let body;
  if(isMinister){
  body =
    `你是 ${clubName} 的【负责人】。\n\n`+
    `退出意味着你要卸下这个位子，把社团交给其他人。\n\n`+
    `· 你需要指定下一任负责人\n`+
    `· 成员们会记住你的这个决定\n`+
    `· 社团里认识的人还在，但关系可能变淡\n`+
    (hasTask?`\n⚠️ 进行中的社团任务「${hasTask.n}」会被放弃。\n`:'')+
    `\n确定要退出吗？`;
}else{
  body =
    `你是 ${clubName} 的【成员】。\n\n`+
    `退出后：\n`+
    `· 不能再参加 ${clubName} 的社团活动\n`+
    `· 社团里认识的人还在，但关系会淡一些\n`+
    (hasTask?`\n⚠️ 进行中的社团任务「${hasTask.n}」会被放弃。\n`:'')+
    (ministerNpc?`\n${ministerNpc.name} 是社团的负责人。`:'')+
    `\n\n确定要退出吗？`;
}

  showChoice(`🚪 退出 ${clubName}`, body, [
    {label:'再想想', value:'no', cls:'ghost'},
    {label:'确定退出', value:'yes', cls:'warn'}
  ], (v)=>{
    if(v==='yes') doQuitClub(clubName, isMinister);
  });
}

function doQuitClub(clubName, isMinister){
  if(!S.player.clubs.includes(clubName)) return;
  const before = snapshot();

  /* ===== 放弃该社团的任务 ===== */
  let taskLost = null;
  if(S.activeClubTask && S.activeClubTask.club===clubName){
    taskLost = S.activeClubTask;
    S.clubTaskHistory.push({...S.activeClubTask, failed:true, abandoned:true});
    S.activeClubTask = null;
  }

  const members = S.npcs.filter(n => n.club===clubName && n.known && n.role!=='前负责人' && n.role!=='已毕业校友');
  const ministerNpc = members.find(n => n.role==='社团负责人');

  let body = '', changes = [];

  if(isMinister){
    /* ===== 负责人退出 ===== */
    const candidates = members
      .filter(n => n.role==='社团成员')
      .sort((a,b) => b.aff - a.aff);
    const successor = candidates[0] || null;

    /* 玩家退出 */
    S.player.clubs = S.player.clubs.filter(c => c !== clubName);
    S.player.clubRole = null;

    /* 交接：新负责人接任 */
    let reactionLine = '';
    if(successor){
      successor.role = '社团负责人';
      successor.desc = `${clubName} 的负责人`;
      successor.aff = clamp(successor.aff + 8, 0, 100);

      if(successor.aff >= 70){
        reactionLine =
          `${successor.name} 接过钥匙，没说太多话。\n\n`+
          `“我知道了。”\n\n`+
          `但交接之后，${getPronoun(successor).sub}忽然叫住了你：\n\n`+
          `“负责人……以后还能来找你吗？”`;
      }else if(successor.aff >= 40){
        reactionLine =
          `${successor.name} 接过钥匙，点了点头。\n\n`+
          `“我会做好的。”\n\n`+
          `然后${getPronoun(successor).sub}低头看了看手里的东西，没再说话。`;
      }else{
        reactionLine =
          `${successor.name} 接过钥匙，没怎么看你的眼睛。\n\n`+
          `“嗯。”`;
      }
    }else{
      reactionLine =
        `社团里还没有合适的人接手。\n\n`+
        `指导老师叹了口气，说先把事情挂着，之后再想办法。`;
    }

    /* 其他成员反应 */
    const others = members.filter(n => n !== successor);
    const closeOnes = others.filter(n => n.aff >= 60);
    const coldOnes = others.filter(n => n.aff < 30);
    closeOnes.forEach(n => { n.aff = clamp(n.aff + 3, 0, 100); });
    coldOnes.forEach(n => { n.aff = clamp(n.aff - 3, 0, 100); });

    const closeLine = closeOnes.length
      ? `\n\n${closeOnes.map(n=>n.name).join('、')} 也来找你说了几句。\n\n“其实挺舍不得你走的。”`
      : '';
    const coldLine = coldOnes.length
      ? `\n\n${coldOnes.map(n=>n.name).join('、')} 没说什么，表情淡淡的。`
      : '';
    const taskLine = taskLost
      ? `\n\n📋 进行中的社团任务「${taskLost.n}」随着你的退出，被放弃了。`
      : '';

    body =
      `你把辞职信放在了指导老师的桌上。\n\n`+
      `消息传得很快。当天下午，社团群里安静了很久。\n\n`+
      `然后有人发了一条：\n\n`+
      `“负责人真的要走了？”\n\n`+
      `你没有回。\n\n`+
      `交接那天，你在活动室里坐了很久。\n\n`+
      `${reactionLine}`+
      closeLine + coldLine + taskLine + `\n\n`+
      `你从 ${clubName} 的负责人，变回了普通的一个人。\n\n`+
      `走出活动室的时候，你回头看了一眼。`;

    changes.push({label:`🚪 退出 ${clubName}`, dir:'down'});
    changes.push({label:'卸任负责人', dir:'down'});
    if(successor) changes.push({label:`${successor.name} 接任`, dir:'up'});
    if(taskLost) changes.push({label:'📋 任务放弃', dir:'down'});
    S.mood = clamp(S.mood - 12, 0, 100);
    changes.push({label:'心情 -12', dir:'down'});

  }else{
    /* ===== 部员退出 ===== */
    S.player.clubs = S.player.clubs.filter(c => c !== clubName);

    let reactionLine = '';
    if(ministerNpc){
      let affDelta;
      if(ministerNpc.aff >= 70){
        affDelta = -3;
        reactionLine =
          `${ministerNpc.name} 看了你很久，最后叹了口气。\n\n`+
          `“我尊重你的决定。”\n\n`+
          `${getPronoun(ministerNpc).sub}顿了一下，又补了一句：\n\n`+
          `“以后有什么需要帮忙的，随时找我。”`;
      }else if(ministerNpc.aff >= 40){
        affDelta = -5;
        reactionLine =
          `${ministerNpc.name} 点了点头，语气很平。\n\n`+
          `“行吧。谢谢你之前的付出。”\n\n`+
          `${getPronoun(ministerNpc).sub}把表格收起来，没再多说什么。`;
      }else{
        affDelta = -8;
        reactionLine =
          `${ministerNpc.name} 只是“嗯”了一声，然后低头继续看手里的东西。\n\n`+
          `你站在旁边，也没再多说什么。`;
      }
      ministerNpc.aff = clamp(ministerNpc.aff + affDelta, 0, 100);
      changes.push({label:`${ministerNpc.name} 好感 ${affDelta}`, dir:'down'});
    }else{
      reactionLine =
        `你把退出申请递了过去。\n\n`+
        `没人多问什么。\n\n`+
        `社团里认识的人还在，只是以后不会再以“社团成员”的身份见面了。`;
    }

    /* 其他成员的连带反应 */
    const closeFriends = members.filter(n => n !== ministerNpc && n.aff >= 60);
    closeFriends.forEach(n => { n.aff = clamp(n.aff - 4, 0, 100); });
    const closeLine = closeFriends.length
      ? `\n\n${closeFriends.map(n=>n.name).join('、')} 看到消息后，都来问了一句“为什么”。\n\n你没怎么解释。`
      : '';

    const taskLine = taskLost
      ? `\n\n📋 进行中的社团任务「${taskLost.n}」也被放弃了。`
      : '';

    body =
      `你把退出申请递了过去。\n\n`+
      `${reactionLine}`+
      closeLine + taskLine + `\n\n`+
      `你最后看了一眼活动室。\n\n`+
      `墙上贴着社团活动的照片，有一张里面有你。`;

    changes.push({label:`🚪 退出 ${clubName}`, dir:'down'});
    if(taskLost) changes.push({label:'📋 任务放弃', dir:'down'});
    S.mood = clamp(S.mood - 8, 0, 100);
    changes.push({label:'心情 -8', dir:'down'});
  }

  addEvent(`🚪 你退出了 ${clubName}${isMinister?'（卸任负责人）':''}。`, 'club');

  /* 退出后回到主界面 */
  S._clubActStep = null;
  S._clubActClub = null;

  const after = snapshot();
  const statChanges = diffStats(before, after);
  const allChanges = statChanges.concat(changes);

  gotoScene(`${isMinister?'👑':'🚪'} 退出 ${clubName}`, body, allChanges);
}

function buildSocialScene(place,npc,isNew){

// 过滤掉近期出现过的地点剧情

if(availableScenes.length === 0){
  S._recentPlaceScenes = [];
  availableScenes = scenes;
}

const rawScene = pick(availableScenes);
S._recentPlaceScenes.push(rawScene);
if(S._recentPlaceScenes.length > 15) S._recentPlaceScenes.shift(); // 记住最近15个

const scene=rawScene
  .replace(/\{n\}/g,npc.name)
  .replace(/\{pr\}/g,pron.sub);

    .replace(/\{n\}/g,npc.name)

  let text=`${scene}\n\n${myAct}\n\n${theirReply}`;

  const rf=roleFlavor(npc);

  if(npc.isEx && npc.exWithPlayer)gain=Math.max(1,Math.floor(gain*0.5));
  /* 好感度增长放缓 */

  const body=buildSocialScene(scenePlace,npc,isNew)+wxLine;
  if(npc.isEx && npc.exWithPlayer){

  else if(isNew)title=`🌿 偶遇 · ${npc.name}`;
  else title=`👋 遇见 · ${npc.name}`;

  const shouldJump = !isNew && !npc.isEx;
gotoScene(title, body, changes, null, '',
  shouldJump ? {type:'jumpNpc', id:npc.id} : null

}function affTier(a){
  if(a>=90)return 6;
  if(a>=70)return 5;
  if(a>=50)return 4;
  if(a>=30)return 3;
  if(a>=15)return 2;
  if(a>=5)return 1;
  return 0;
}/* ===== 好感度增长放缓（第14项） =====
   好感越高，每次社交收益越低：
   好感 < 60   → 正常
   好感 60-79  → 每次封顶到 2~4
   好感 ≥ 80   → 每次封顶到 1~2
   例外：NPC 生日当天（聊天翻倍）不受上限影响。 */
function capAffGain(base, oldAff){
  if(!base || base <= 0)return base;
  let cap;
  if(oldAff >= 80)cap = rnd(1,2);
  else if(oldAff >= 60)cap = rnd(2,4);
  else return base;
  return Math.max(1, Math.min(base, cap));
}
function affLabel(a){
  if(a>=90)return'挚友';
  if(a>=70)return'亲密';
  if(a>=50)return'好友';
  if(a>=30)return'朋友';
  if(a>=15)return'熟人';
  if(a>=5)return'点头之交';
  return'陌生';
}

/* ===== 打电话 / 发消息系统 ===== */
function phoneCallNpc(n){
  if(S.chatted.includes(n.id)) return;
  S.chatted.push(n.id);

  const before = snapshot();
  const affBefore = n.aff;
  const type = getPhoneType(n);
  const aff = n.aff;

  let tier;
  if(aff >= 80) tier = 3;
  else if(aff >= 50) tier = 2;
  else if(aff >= 20) tier = 1;
  else tier = 0;

  /* 好感增益（打电话比面对面略低） */
  let g = capAffGain(rnd(2, 5), n.aff);
  g = Math.max(1, Math.round(g * 0.7));
  n.aff = clamp(n.aff + g, 0, 100);
  const real = n.aff - affBefore;

  S.energy = clamp(S.energy - 2, 0, 100);
  S.mood   = clamp(S.mood + 2, 0, 100);

  const scene = buildPhoneScene(n, type, tier, real);
  addEvent(`📱 你给 ${n.name} 发了消息，好感 +${real}。`, 'npc');

  const after = snapshot();
  const changes = diffStats(before, after);
  changes.push({label:`好感 +${real}`, dir:'up'});

  gotoScene(`📱 给 ${n.name} 发消息`, scene, changes);
}

function buildPhoneScene(n, type, tier, real){
  const pron = getPronoun(n);
  const s = pron.sub;

  if(type === 'teacher') return phoneTeacher(n, s, tier);
  if(type === 'counselor') return phoneCounselor(n, s, tier);
  if(type === 'service') return phoneService(n, s, tier);
  return phoneStudent(n, s, tier);
}

function chatNpc(n){
  if(S.chatted.includes(n.id))return;
  if(n.isEx && n.exWithPlayer){
    /* 前任不给选择，直接打照面 */
    doChatNpc(n,'ex');
    return;
  }
  showChoice(
    `💬 和 ${n.name} 聊天`,
    `你们坐了下来。\n\n想怎么开口？`,
    [
      {label:'认真听对方说', value:'listen'},
      {label:'开个玩笑', value:'joke'},
      {label:'随便聊聊', value:'casual'}
    ],
    (v) => doChatNpc(n, v)
  );
}

/* 聊天主体：根据选择结算 */
function doChatNpc(n, choice){
  S.chatted.push(n.id);

  const pron=getPronoun(n);
  const chem=chemistry(S.player.personality,n.person);
  const traitBonus=S.player.personality==='开朗'||S.player.personality==='热心'?2:
                    S.player.personality==='高冷'?-2:
                    S.player.personality==='内向'?-1:0;
  const bonus = (S.player.gender !== n.gender) ? 1 : 0;
  let g=Math.max(2,rnd(3,7)+bonus+chem+traitBonus+Math.floor(S.player.base.情商/40));
  if(n.isEx && n.exWithPlayer)g=Math.max(1,Math.floor(g*0.5));

  let extraMood=0;
  let choiceLine='';
  let choiceNote='';
  if(choice==='listen'){
    g+=2;
    extraMood=+3;
    choiceNote='（认真倾听）';
  }else if(choice==='joke'){
    if(isElderRole(n)){
      g-=1;
      extraMood=-1;
      choiceNote='（开了个玩笑）';
    }else{
      const likesJoke=['开朗','活泼','元气','热心','毒舌','腹黑'].includes(n.person);
      if(likesJoke){g+=1;extraMood=+5;choiceNote='（开了个玩笑）';}

        body+=`\n\n聊着聊着，${n.name} 忽然提起：“对了，${pn.name} 最近还好吗？”语气里带着说不出的柔软。`;
      }else if(n.romance==='暗恋中'){
        body+=`\n\n${n.name} 忽然问：“你觉得 ${pn.name}……怎么样？”你注意到${pron.sub}说这话的时候，眼神有点飘。`;
      }else if(n.romance==='暧昧中'){
        body+=`\n\n${n.name} 提起 ${pn.name} 的时候，笑了一下，又很快收住。`;
      }
    }
  }
}

  if(lvl>=4 && n.relations && Object.keys(n.relations).length>0 && Math.random()<0.35){
    const rid=pick(Object.keys(n.relations));
    const rn=S.npcs.find(x=>x.id===Number(rid));
    if(rn && rn.known){
      const rel=n.relations[rid];
      body+=`\n\n${n.name} 顺便提起：“对了，${rn.name} 前几天还问起你。我们${rel}，人挺好的。”`;
    }
  }

  addEvent(`💬 你和 ${n.name} 聊天，好感度 +${real}。`,'npc');
  const willConfess=checkConfess(n);
  const after=snapshot();
  const changes=diffStats(before,after);
  changes.push({label:`好感度 +${real}`,dir:'up'});
  if(choiceNote)changes.push({label:choiceNote,dir:'up'});
  if(isBday)changes.push({label:'🎂 生日翻倍',dir:'love'});
  if(reciteDone)changes.push({label:'💭 想起了往事',dir:'love'});

  const chatTopics=[
    '你和 '+n.name+' 聊了很久',
    n.name+' 跟你分享了最近的事',
    '你们聊到了半夜',
    '你和 '+n.name+' 聊得很开心',
    n.name+' 对你说了些心里话'
  ];
  if(affTier(n.aff)>=4){
    addMemory(n, pick([
      '你们聊到深夜，'+n.name+' 说了很多平时不会说出口的事',
      n.name+' 跟你讲了很多以前的事',
      n.name+' 把最近的心事都告诉你了'
    ]), 'chat');
  }else if(affTier(n.aff)>=2){
    addMemory(n, pick(chatTopics), 'chat');
  }

  gotoScene(`💬 和 ${n.name} 聊天`, body, changes, null, '',
  willConfess ? {type:'confess', id:n.id} : null
);

};function goOutMenu(npc){
  const old=document.querySelector('.modal-wrap');
  if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.className='modal-wrap';
  const title=npc.isEx&&npc.exWithPlayer?`💔 和前任 ${npc.name} 出去`:`🎈 和 ${npc.name} 出去玩`;
  wrap.innerHTML=`
    <div class="modal-box">
      <div class="modal-title">${escapeHtml(title)}</div>
      <div class="modal-body">选择去哪里：</div>
      <div class="chips" style="margin-bottom:14px;max-height:45vh;overflow-y:auto">
        ${OUT_PLACES.map(p=>`<button class="chip" data-out="${escapeHtml(p.n)}">${p.icon} ${escapeHtml(p.n)}</button>`).join('')}
      </div>
      <button class="btn ghost" style="width:100%" id="cancelOut">取消</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#cancelOut').onclick=()=>wrap.remove();
  wrap.querySelectorAll('[data-out]').forEach(btn=>{
    btn.onclick=()=>{
      const place=btn.dataset.out;
      const info=OUT_PLACES.find(p=>p.n===place);
      wrap.querySelector('.modal-body').innerHTML=`在 ${escapeHtml(place)} 做什么？`;
      wrap.querySelector('.chips').innerHTML=info.acts.map(a=>
        `<button class="chip" data-act2="${escapeHtml(a)}">${escapeHtml(a)}</button>`
      ).join('');
      wrap.querySelectorAll('[data-act2]').forEach(b2=>{
        b2.onclick=()=>{
          const act=b2.dataset.act2;
          wrap.remove();
          goOut(npc,place,act);
        };
      });
    };
  });
}function buildOutReaction(npc){
  const pron=getPronoun(npc);
  const s=pron.sub;
  const mine=S.player.personality;
  const theirs=npc.person;
  const playerTop=(S.player.position||'主动型')==='主动型';

  const mineActive=['开朗','热心','感性','毒舌','元气'].includes(mine);
  const mineReserved=['内向','温和','高冷','理性'].includes(mine);
  const theirsActive=['开朗','热心','元气','活泼','腹黑'].includes(theirs);
  const theirsReserved=['内向','温柔','高冷','稳重','闷骚'].includes(theirs);

  const aff=npc.aff;
  let affTier=1;
  if(aff>=80)affTier=3;
  else if(aff>=60)affTier=2;

  let posLine='';
  if(playerTop){
    if(affTier>=3){
      if(mineActive) posLine=`你顺势揽住 ${npc.name} 的肩膀，${s}没有躲，只是低着头笑了。`;
      else if(mineReserved) posLine=`你不声不响地往 ${npc.name} 那边挪了一点。${s}看了你一眼，什么都没说。`;
      else posLine=`你自然而然地走在 ${npc.name} 的里侧，把{pr}护在靠墙的一边。`;
    }else if(affTier===2){
      if(mineActive) posLine=`你笑着凑近 ${npc.name} 一点，${s}的耳根红了一下。`;
      else posLine=`你不自觉放慢脚步，等 ${npc.name} 跟上来。`;
    }else{
      posLine=`你走在 ${npc.name} 旁边，肩膀偶尔碰到，两个人都会本能地让开一点。`;
    }
  }else{
    if(affTier>=3){
      if(mineReserved) posLine=`你轻轻拽住 ${npc.name} 的衣角。${s}低头看了一眼，反手把整个手握住。`;
      else if(mineActive) posLine=`你挽住 ${npc.name} 的手臂。${s}愣了一下，没有甩开。`;
      else posLine=`你往 ${npc.name} 身边靠了靠。{pr}的体温隔着衣服传过来。`;
    }else if(affTier===2){
      posLine=`你忍不住往 ${npc.name} 那边挪了挪。${s}什么都没说，但也没退开。`;
    }else{
      posLine=`你跟 ${npc.name} 并肩走着，手指有点不知道该放哪里。`;
    }
  }

  let chemLine='';
  if(mineActive && theirsReserved){
    chemLine=`${npc.name} 一直在安静地听你说话。偶尔应你一句，笑一下。那种安静不是敷衍，是认真。`;
  }else if(mineReserved && theirsActive){
    chemLine=`${npc.name} 一直在你身边说个不停。你只是听着，偶尔应一声。${s}好像就很开心。`;
  }else if(mineActive && theirsActive){
    chemLine=`你们从一件事聊到另一件事，话题跳来跳去，谁也没觉得累。`;
  }else if(mineReserved && theirsReserved){
    chemLine=`你们没有说话。那种安静，反而让人觉得很踏实。`;
  }else{
    chemLine=`${npc.name} 看了你一眼，什么都没说。但眼神是软的。`;
  }

  let tail='';
  if(affTier>=3 && Math.random()<0.5){
    tail = `\n\n${npc.name} 忽然说：“其实，和你在一起的时候，我最放松。”`;
    npc.aff=clamp(npc.aff+2,0,100);
  }

  return `${posLine}\n\n${chemLine}${tail}`;
}/* 外出入口：先弹出选择支 */
function goOut(npc,place,act){
  if(S.ap<=0){gotoScene('⏰ 行动点用完了','本周的行动点已经用完。',[]);return;}
  if(npc.isEx && npc.exWithPlayer){
    doGoOut(npc,place,act,'ex');
    return;
  }
  showChoice(
    `🎈 和 ${npc.name} 去${place}`,
    `到了 ${place}，你想怎么做？`,
    [
      {label:'主动一点', value:'active'},
      {label:'保持距离', value:'distance'},
      {label:'顺着对方', value:'follow'}
    ],
    (v) => doGoOut(npc,place,act,v)
  );
}

/* 外出主体：根据选择结算 */
function doGoOut(npc,place,act,choice){
  S.ap--;
  const before=snapshot();
  const affBefore=npc.aff;
  const chem=chemistry(S.player.personality,npc.person);
  const w=getWeather();
  const outdoor=isOutdoor(place);

  let mul=1;
  if(outdoor){
    if(w.id==='rain')mul=0.6;
    else if(w.id==='snow')mul=0.5;
    else if(w.id==='wind')mul=0.75;
    else if(w.id==='sunny')mul=1.15;
  }

  /* 选择支对好感度的额外影响 */
  let extra=0;
  let choiceNote='';
  if(choice==='active'){
    extra=3;
    choiceNote='（主动一点）';
  }else if(choice==='distance'){
    extra=0;
    choiceNote='（保持距离）';
  }else if(choice==='follow'){
    extra=2;
    choiceNote='（顺着对方）';
  }

  let gain=Math.max(4,rnd(6,12)+chem+Math.floor(S.player.base.外貌/40)+extra);
  gain=Math.max(2,Math.round(gain*mul));
  if(npc.isEx && npc.exWithPlayer)gain=Math.max(1,Math.floor(gain*0.5));
  gain=capAffGain(Math.round(gain*1.5), npc.aff);
  npc.aff=clamp(npc.aff+gain,0,100);
  const real=npc.aff-affBefore;
  const moodGain=(outdoor && mul<1)?6:10;
  S.mood=clamp(S.mood+moodGain,0,100);
  S.energy=clamp(S.energy-8,0,100);
  addMoney(-50);

  const wLine=outdoor?outdoorWeatherLine(place):(
    w && w.id==='snow' ? `\n\n（${w.icon} 外面下着雪，屋里很暖和。）` :
    w && w.id==='rain' ? `\n\n（${w.icon} 窗外雨声没停。）` : ''
  );

  if(choice==='ex' && npc.isEx && npc.exWithPlayer){
    const pron=getPronoun(npc);
    const exLine=pick(EX_OUT_LINES)
      .replace(/\{n\}/g,npc.name)
      .replace(/\{pr\}/g,pron.sub);
    let body=`你和 ${npc.name} 去了${place}，一起${act}。\n\n${exLine}${wLine}`;
    if(npc.aff>=50)body+=`\n\n回去的路上，${npc.name} 忽然说：“其实……以前挺好的。”`;
    else if(npc.aff>=30)body+=`\n\n分别的时候，${npc.name} 冲你点了点头，没说话。`;
    else body+=`\n\n你们各自散了，像两个陌生人。`;
    addEvent(`💔 你和前任 ${npc.name} 去了${place}，好感度 +${real}。`,'break');
    const after=snapshot();
    const changes=diffStats(before,after);
    changes.push({label:`好感度 +${real}`,dir:'up'});
    gotoScene(`💔 ${place} · ${act}`,body,changes);
    return;
  }

  const pron=getPronoun(npc);
  let affTier='low';
  if(npc.aff>=80)affTier='high';
  else if(npc.aff>=60)affTier='mid';

  const pool=OUT_SCENES[place]||OUT_SCENES['操场'];
  const scene=pick(pool[affTier]||pool.low)
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub)
    .replace(/\{pos\}/g,pron.pos);

  /* 选择支影响描写 */
  let choiceLine='';
  if(choice==='active'){
    if(S.player.position==='主动型'){
      choiceLine=`你走在靠外侧，自然地把 ${npc.name} 护在里侧。`;
    }else{
      choiceLine=`你伸手轻轻拉住 ${npc.name} 的袖子，${pron.sub}低头看了一眼，没有松开。`;
    }
  }else if(choice==='distance'){
    choiceLine=`你刻意保持着半步的距离。${npc.name} 似乎察觉到了，也没有靠过来。`;
  }else if(choice==='follow'){
    choiceLine=`你顺着 ${npc.name} 的节奏，${pron.sub} 走快你就走快，${pron.sub} 停下你也停下。`;
  }

  const reaction=buildOutReaction(npc);
  const body=`你和 ${npc.name} 去了${place}，一起${act}。\n\n${scene}${wLine}\n\n${choiceLine}\n\n${reaction}`;

});function buildDateReaction(npc,loveTier){
  const pron=getPronoun(npc);
  const s=pron.sub;
  const mine=S.player.personality;
  const theirs=npc.person;
  const playerTop=(S.player.position||'主动型')==='主动型';

  const mineActive=['开朗','热心','感性','毒舌','元气'].includes(mine);
  const mineReserved=['内向','温和','高冷','理性'].includes(mine);
  const theirsActive=['开朗','热心','元气','活泼','腹黑'].includes(theirs);
  const theirsReserved=['内向','温柔','高冷','稳重','闷骚'].includes(theirs);

  let posLine='';
  if(playerTop){
    if(loveTier>=3){
      if(mineActive) posLine=`你顺势把 ${npc.name} 往自己这边带了带，${s}也没躲，就那样靠过来。`;
      else if(mineReserved) posLine=`你没说什么，只是很自然地把 ${npc.name} 往身边拢了一下。${s}抬头看了你一眼。`;
      else posLine=`你走在外侧，把 ${npc.name} 护在里侧。`;
    }else if(loveTier===2){
      if(mineActive) posLine=`你笑着凑近 ${npc.name}，${s}的耳朵红了一下。`;
      else posLine=`你不自觉放慢脚步，让 ${npc.name} 跟得上你。`;
    }else{
      posLine=`你走在${npc.name}旁边，肩膀偶尔碰到，又各自分开。`;
    }
  }else{
    if(loveTier>=3){
      if(mineReserved) posLine=`你悄悄牵住 ${npc.name} 的衣角，${s}低头看了一眼，然后反手握住了你。`;
      else if(mineActive) posLine=`你挽住 ${npc.name} 的手臂，${s}愣了一下，但没甩开。`;
      else posLine=`你靠在 ${npc.name} 身边，${s}的体温隔着衣服一点点传过来。`;
    }else if(loveTier===2){
      posLine=`你忍不住往 ${npc.name} 那边挪了挪，${s}什么都没说，但也没有退开。`;
    }else{
      posLine=`你跟 ${npc.name} 并肩走着，手指有点不知道该放哪里。`;
    }
  }

  let chemLine='';
  if(mineActive && theirsReserved){
    chemLine=`${npc.name} 一直安静地听着你说话，偶尔笑一下。那种安静不是敷衍，是认真。`;
  }else if(mineReserved && theirsActive){
    chemLine=`${npc.name} 一直在你身边说个不停，你只是听着，偶尔应一声，${s}好像就很开心。`;
  }else if(mineActive && theirsActive){
    chemLine=`你们从一件事聊到另一件事，话题跳来跳去，谁也没觉得累。`;
  }else if(mineReserved && theirsReserved){
    chemLine=`你们没有说话。那种安静，反而让人觉得很踏实。`;
  }else{
    chemLine=`${npc.name} 看了你一眼，什么都没说，但眼神很软。`;
  }

  return `${posLine}\n\n${chemLine}`;
}/* 约会入口：先弹出选择支 */
function doDate(npc,place,act){

  showChoice(
    `💕 和 ${npc.name} 在${place}`,

    [
      {label:'靠近一点', value:'close'},
      {label:'聊聊天', value:'talk'},
      {label:'安静待着', value:'quiet'}
    ],
    (v) => doDateReal(npc,place,act,v)
  );
}

/* 约会主体：根据选择结算 */
function doDateReal(npc,place,act,choice){
  S.ap--;
  const before=snapshot();
  const loveBefore=npc.love;
  const chem=chemistry(S.player.personality,npc.person);
  const w=getWeather();
  const outdoor=isOutdoor(place);

  let mul=1;
  if(outdoor){
    if(w.id==='rain')mul=0.65;
    else if(w.id==='snow')mul=0.55;
    else if(w.id==='wind')mul=0.8;
    else if(w.id==='sunny')mul=1.2;
  }

  /* 选择支影响数值 */
  let loveBonus=0, moodBonus=0, choiceNote='';
  if(choice==='close'){loveBonus=4;moodBonus=2;choiceNote='（靠近一点）';}
  else if(choice==='talk'){loveBonus=2;moodBonus=3;choiceNote='（聊了聊）';}
  else if(choice==='quiet'){loveBonus=1;moodBonus=5;choiceNote='（安静待着）';}

  let affGain=Math.max(3,rnd(5,10)+chem);
  let loveGain=Math.max(5,rnd(8,15)+Math.floor(S.player.base.情商/30)+chem+loveBonus);
  affGain=Math.max(2,Math.round(affGain*mul));
  loveGain=Math.max(4,Math.round(loveGain*mul));
  npc.aff=clamp(npc.aff+affGain,0,100);
  npc.love=clamp(npc.love+loveGain,0,100);
  const moodGain=((outdoor && mul<1)?10:15)+moodBonus;
  S.mood=clamp(S.mood+moodGain,0,100);
  S.energy=clamp(S.energy-12,0,100);
  addMoney(-100);

  const pron=getPronoun(npc);
  let loveTier=1;
  if(npc.love>=80)loveTier=3;
  else if(npc.love>=50)loveTier=2;

  const pool=DATE_SCENES[place]||DATE_SCENES['公园'];
  const tier=pool['t'+loveTier]||pool.t1;
  const scene=pick(tier)
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub)
    .replace(/\{pos\}/g,pron.pos);

  /* 选择支描写 */
  let choiceLine='';
  if(choice==='close'){
    choiceLine = S.player.position==='主动型'
      ? `你伸手把 ${npc.name} 揽到身边，${pron.sub}没有躲，就那样靠过来。`
      : `你往 ${npc.name} 身边挪了挪，${pron.sub}反手把你握住了。`;
  }else if(choice==='talk'){
    choiceLine=`你说了些平时不会说出口的话。${npc.name} 听着，偶尔低头笑一下。`;
  }else if(choice==='quiet'){
    choiceLine=`你们什么也没说，只是待在一起。那种安静，反而让人踏实。`;
  }

  const reaction=buildDateReaction(npc,loveTier);

/* ===== 关系网可视化 ===== */
function buildRelationGraph(centerNpc){
  /* 返回 {center, nodes:[{npc, rel, aff}]} */
  if(!centerNpc)return null;
  const rels=centerNpc.relations||{};
  const nodes=[];
  Object.keys(rels).forEach(rid=>{
    const rn=S.npcs.find(x=>x.id===Number(rid));
    if(rn && rn.known){
      nodes.push({
        npc:rn,
        rel:rels[rid],
        aff:rn.aff
      });
    }
  });
  /* 按关系类型排序，同类的排在一起 */
  const order=['同社团','同学','朋友','老乡','高中同学','表亲','室友'];
  nodes.sort((a,b)=>{
    const oa=order.indexOf(a.rel);
    const ob=order.indexOf(b.rel);
    if(oa!==ob)return oa-ob;
    return b.aff-a.aff;
  });
  return {center:centerNpc, nodes};
}

function relColor(rel){
  if(rel==='同社团')return '#a5b4fc';
  if(rel==='同学')return '#7dd3fc';
  if(rel==='朋友')return '#6ee7b7';
  if(rel==='老乡')return '#fbbf24';
  if(rel==='高中同学')return '#fdba74';
  if(rel==='表亲')return '#f9a8d4';
  if(rel==='室友')return '#c4b5fd';
  return '#cbd5e1';
}

function vRelation(){
  const known = S.npcs.filter(n => n.known);

  if(!known.length){
    return `
    <div class="sect-title">🕸️ 关系网</div>
    <div class="card" style="padding:20px;text-align:center">
      <div class="mini">你还没有认识任何人。<br>先去社交吧。</div>
    </div>`;
  }

  /* ===== 布局计算：分内外两环，减少节点重叠 ===== */
const total = known.length;

/* 好感 ≥ 60 放内环，其余放外环；人少时不分环 */
const innerNpcs = known.filter(n => n.aff >= 60);
const outerNpcs = known.filter(n => n.aff < 60);
const useTwoRings = total > 15 && innerNpcs.length > 0 && outerNpcs.length > 0;

/* 外环半径随人数变化，内环取外环 0.6 倍并保底 90 */
const R2 = Math.max(120, total * 9);
const R1 = useTwoRings ? Math.max(90, Math.round(R2 * 0.6)) : R2;

/* 画布尺寸按最大半径，两侧各留 70px 给名字 */
const W = R2 * 2 + 140;
const H = R2 * 2 + 140;
const cx = W / 2;
const cy = H / 2;
const playerR = 30;
const nodeR = 18;

/* 计算每个 NPC 的角度和坐标（从正上方开始，顺时针） */
const positions = {};
const placeRing = (list, radius, startAngle) => {
  const n = list.length;
  if (!n) return;
  list.forEach((npc, i) => {
    const angle = startAngle + (2 * Math.PI * i / n);
    positions[npc.id] = {
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius
    };
  });
};

if (useTwoRings) {
  /* 外环起始角错开半个间隔，避免内外环节点正对 */
  placeRing(innerNpcs, R1, -Math.PI / 2);
  placeRing(outerNpcs, R2, -Math.PI / 2 + Math.PI / outerNpcs.length);
} else {
  placeRing(known, R2, -Math.PI / 2);
}

  /* ===== 绘制连线 ===== */
  let lines = '';

  /* 玩家 → 每个 NPC */
  known.forEach(n => {
    const p = positions[n.id];
    lines += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#a5b4fc" stroke-width="1.5" opacity="0.55"/>`;
  });

  /* NPC ↔ NPC 关系（只画双方都认识的，且不重复画） */
  const drawnPairs = new Set();
  known.forEach(a => {
    if(!a.relations) return;
    Object.keys(a.relations).forEach(rid => {
      const b = S.npcs.find(x => x.id === Number(rid));
      if(!b || !b.known) return;
      const key = Math.min(a.id, b.id) + '_' + Math.max(a.id, b.id);
      if(drawnPairs.has(key)) return;
      drawnPairs.add(key);
      const pa = positions[a.id];
      const pb = positions[b.id];
      const rel = a.relations[rid];
      lines += `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${relColor(rel)}" stroke-width="1.3" opacity="0.45"/>`;
    });
  });

  /* ===== 玩家（中心） ===== */
  const playerInitial = (S.player.name || '我')[0] || '我';
  const centerAvatar = `
    <circle cx="${cx}" cy="${cy}" r="${playerR}" fill="#20536b" opacity="0.95"/>
    <circle cx="${cx}" cy="${cy}" r="${playerR + 3}" fill="none" stroke="#20536b" stroke-width="1.2" opacity="0.35"/>
    <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${esc(playerInitial)}</text>
    <text x="${cx}" y="${cy + playerR + 14}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#20536b">我</text>
`;

  /* ===== NPC 节点 ===== */
let nodeSVG = '';
known.forEach(n => {
  const p = positions[n.id];
  const color = avatarColor(n.id);
  const tagStar = n.tag ? '⭐' : '';
  nodeSVG += `
    <g id="rel-node-${n.id}" style="cursor:pointer" data-act="selNpc" data-val="${n.id}">
      <circle cx="${p.x}" cy="${p.y}" r="${nodeR}" fill="${color}" opacity="0.95"/>
      <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${esc((n.name || '?')[0])}</text>
      <text x="${p.x}" y="${p.y + nodeR + 11}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#20536b">${esc(n.name)}${tagStar}</text>
    </g>
  `;
});

  const svg = `
    <svg id="relSvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">
      ${lines}
      ${centerAvatar}
      ${nodeSVG}
    </svg>
  `;

  /* ===== 顶部名字（横排、可滚动） ===== */
  const sortedKnown = [...known].sort((a, b) => b.aff - a.aff);
  const pickerHTML = `
    <div style="display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none">
      ${sortedKnown.map(n => `
        <button data-act="relCenter" data-val="${n.id}"
          style="flex:0 0 auto;padding:4px 11px;font-size:12px;border-radius:14px;white-space:nowrap;
          border:1.5px solid #dbeafe;background:#fff;color:#5b7a94;font-family:inherit;cursor:pointer;
          transition:.15s">${esc(n.name)}</button>
      `).join('')}
    </div>
  `;

  /* ===== 图例 ===== */
  const relTypes = {};
  known.forEach(a => {
    if(!a.relations) return;
    Object.keys(a.relations).forEach(rid => {
      const b = S.npcs.find(x => x.id === Number(rid));
      if(!b || !b.known) return;
      relTypes[a.relations[rid]] = true;

}/* ===== 恋人纪念日 ===== */
function absWeek(sem,wk){
  return (sem-1)*16 + wk;
}

function currentAbsWeek(){
  return absWeek(S.semester, S.week);
}

/* 判断某个恋人本周是否是纪念日 */
function isAnniversaryWeek(npc){
  if(!npc || npc.love<=0)return false;
  if(!npc.loveStartAbs)return false;
  const curr=currentAbsWeek();
  const diff=curr - npc.loveStartAbs;
  return diff>0 && diff%4===0;
}

/* 本周纪念日是否已处理 */
function isAnniversaryHandled(npc){
  if(!npc || !npc.lastAnnivAbs)return false;
  return npc.lastAnnivAbs===currentAbsWeek();
}

/* 纪念日距今第几次（用于剧情描述） */
function anniversaryCount(npc){
  if(!npc || !npc.loveStartAbs)return 1;
  const diff=currentAbsWeek() - npc.loveStartAbs;
  return Math.floor(diff/4);
}

function doVacationAction(id){
  const opt=VACATION_OPTIONS.find(o=>o.id===id);
  if(!opt)return;
  const sem=S._vacationSemester||S.semester;
  const label=vacationLabel(sem);

  /* 找朋友玩：需要有合适的人 */
  let meetNpc=null;
  if(id==='meet'){
    const eligible=S.npcs.filter(n=>n.known && !n.isEx && n.love<=0 && n.aff>=40);
    eligible.sort((a,b)=>b.aff-a.aff);
    meetNpc=eligible[0]||null;
    if(!meetNpc){
      showModal('👥 假期',
        '你想约人出来见面，翻了一遍通讯录，却没找到特别想约的。\n\n于是你只是自己出去走了一圈。',
        [{label:'心情 +5',dir:'up'}],()=>{
          S.mood=clamp(S.mood+5,0,100);
          addEvent(`🎒 ${label}：你没有约到人，自己出去走了走。`,'act');
          finishVacation();
        });
      return;
    }
  }

  /* 结算 */
  let body='';
  const changes=[];
  const eff=opt.effects;

  if(id==='home'){
    body=pick(VACATION_HOME_SCENES)+
      '\n\n家里的饭比食堂香，床比宿舍软。你什么都不用操心，只是每天吃、睡、和爸妈聊天。'+
      '\n\n离开家的时候，妈妈塞给你一袋水果，说"到了记得吃饭"。';
    addEvent(`🎒 ${label}：你回家待了一整个假期。`,'good');
  }else if(id==='stay'){
    body=pick(VACATION_STAY_SCENES)+
      '\n\n你每天按时吃饭、按时去自习室，把上个学期没弄懂的东西重新过了一遍。'+
      '\n\n虽然不是热闹的假期，但你觉得很踏实。';
    addEvent(`🎒 ${label}：你留在学校里，安静地过完了假期。`,'good');
  }else if(id==='travel'){
    body=pick(VACATION_TRAVEL_SCENES)+
      '\n\n回来后你晒黑了一点，但眼里的东西好像多了。';
    addEvent(`🎒 ${label}：你出去旅行了一趟。`,'good');
  }else if(id==='work'){
    body=pick(VACATION_WORK_SCENES)+
      '\n\n领工资那天，你请自己吃了一顿好的。';
    addEvent(`🎒 ${label}：你打了一份工，赚了一笔钱。`,'money');
  }else if(id==='meet'){
    const pron=getPronoun(meetNpc);
    const scene=pick(VACATION_MEET_SCENES)
      .replace(/\{n\}/g,meetNpc.name)
      .replace(/\{pr\}/g,pron.sub);
    body=scene+
      `\n\n这一天过得很快。分别的时候，${meetNpc.name} 忽然说："下次还出来。"\n\n你点了点头。`;
    addEvent(`🎒 ${label}：你和 ${meetNpc.name} 见了一面，好感 +15。`,'npc');
  }

  /* 应用效果 */
  if(eff.mood)  S.mood=clamp(S.mood+eff.mood,0,100);
  if(eff.energy)S.energy=clamp(S.energy+eff.energy,0,100);
  if(eff.money) addMoney(eff.money);

  /* skills 里可能是基础属性也可能是技能 */
  const BASE_KEYS=['外貌','智力','情商','体质','才艺','运气'];
  const SKILL_KEYS=['学术','艺术','体育','社交','实践'];
  if(eff.skills){
    Object.keys(eff.skills).forEach(k=>{
      const v=eff.skills[k];
      if(BASE_KEYS.includes(k))addBase(k,v);
      else if(SKILL_KEYS.includes(k))addSkill(k,v);
    });
  }

  if(eff.aff && meetNpc){
    meetNpc.aff=clamp(meetNpc.aff+eff.aff,0,100);
  }

  /* changes 展示 */
  if(eff.mood)  changes.push({label:`心情 ${eff.mood>0?'+':''}${eff.mood}`,dir:eff.mood>0?'up':'down'});
  if(eff.energy)changes.push({label:`精力 ${eff.energy>0?'+':''}${eff.energy}`,dir:eff.energy>0?'up':'down'});
  if(eff.money) changes.push({label:`金钱 ${eff.money>0?'+':''}${eff.money}`,dir:eff.money>0?'money':'down'});
  if(eff.skills){
    Object.keys(eff.skills).forEach(k=>{
      const v=eff.skills[k];
      changes.push({label:`${k} +${v}`,dir:'up'});
    });
  }
  if(eff.aff)   changes.push({label:`好感 +${eff.aff}`,dir:'up'});

  S.vacationHistory=S.vacationHistory||[];
  S.vacationHistory.push({
    sem:sem,
    label:label,
    choice:id,
    name:opt.name,
    npc:meetNpc?meetNpc.name:null
  });

  showModal(`${opt.icon} ${opt.name}`,
    `🎒 ${label}\n\n${body}`,
    changes,
    ()=>finishVacation());
}

function finishVacation(){
  /* ===== 假期生日结算（必须在 _vacationSemester 清空前执行） ===== */
  try{
    if(isPlayerVacationBirthday()){
      const close=S.npcs.filter(n=>n.known && n.aff>=70).sort((a,b)=>b.aff-a.aff).slice(0,4);
      if(close.length){
        S.mood=clamp(S.mood+25,0,100);
        close.forEach(n=>{ n.aff=clamp(n.aff+3,0,100); });
        addEvent(`🎂 假期里你过了一个生日，${close.map(n=>n.name).join('、')} 给你发来了祝福。`,'love');
        S.birthdayHistory=S.birthdayHistory||[];
        S.birthdayHistory.push({sem:S._vacationSemester,week:16,from:close.map(n=>n.name),vacation:true});
      }else{
        S.mood=clamp(S.mood+5,0,100);
        addEvent('🎂 假期里你过了一个生日，安安静静的。','sys');
      }
    }
  }catch(e){}

/* 清理假期状态 */

function openQuickTask(type){
  // ====== 新增：处理纪念日跳转 ======
  if(type.startsWith('anniv_')){
    const npcId = Number(type.split('_')[1]);
    const n = S.npcs.find(x=>x.id===npcId);
    if(n) {
      clearAllModals();
      S.selNpc = n.id;
      S.tab = 'npc';
      render();
      setTimeout(() => {
        const el = document.querySelector('.npc.on');
        if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      }, 60);
    }
    return;
  }

  // ====== 新增：处理NPC生日跳转 ======
  if(type.startsWith('npcbday_')){
    const npcId = Number(type.split('_')[1]);
    const n = S.npcs.find(x=>x.id===npcId);
    if(n) {
      clearAllModals();
      S.selNpc = n.id;
      S.tab = 'npc';
      render();
      setTimeout(() => {
        const el = document.querySelector('.npc.on');
        if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      }, 60);
    }
    return;
  }

  if(type === 'sick'){
    showModal('😷 生病中', `你生病了，剩余 ${S.sick} 周。\n\n去「医务室 - 看病」可以治愈。\n\n每周会降低体质、精力、心情。`, []);
  } else if(type === 'exam'){
    const lvl = examStressLevel();
    const need = examProgressNeed();
    const examTip = isPreExamWeek() ? `第 ${S.week+1} 周就要考试了，学习进程目标 ≈ ${need}。` : `本周就是考试周，考完就可以放松了。`;
    const stressText = ['心态稳，复习到位','刚好够，心里发虚','有点慌，进度不够','非常慌，几乎没复习'][lvl];
    showModal('📝 考试周', `${examTip}\n\n当前学习进程：${S.studyProgress}\n状态评估：${stressText}`, []);
  } else if(type === 'hw'){
  const hw = S.homework;
  if(!hw) return;
  if(hw.done){
    showModal(`📝 本周作业：${hw.type}`,
      `${hw.desc}\n\n本周作业已经完成了，等下周吧。`,
      []);
    return;
  }
  openHomeworkPanel();
  return;
} else if(type === 'comp'){
    const comp = S.activeComp;
    if(!comp) return;
    showModal(`🏅 进行中竞赛：${comp.n}`, 
      `📍 准备地点：${comp.prep}\n\n当前准备值：${comp.prepValue}/100\n\n去准备地点进行「比赛准备」可提升准备值。`, 
      [{label:`准备值 ${comp.prepValue}`, dir:'up'}]);
  } else if(type === 'club'){
    const task = S.activeClubTask;
    if(!task) return;
    showModal(`📋 社团任务：${task.n}`, 
      `${task.d}\n\n📍 前往大学生活动中心 · 社团活动\n📅 期限：第${task.deadlineWeek}周\n📊 进度：${task.progress}/${task.need}\n🎁 奖励：${task.rewardText||'—'}`, 
      [{label:`进度 ${task.progress}/${task.need}`, dir:'up'}]);
  } else if(type === 'campusevent'){
  const ev = S.activeCampusEvent;

    `📍 准备地点：${ev.prep}\n\n当前准备值：${ev.prepValue}/100\n📅 决赛周：第${ev.finalWeek}周\n\n去准备地点进行「活动准备」可提升准备值。`, 
    [{label:`当前准备值 ${ev.prepValue}`, dir:'up'}]);
}

function pickMomentComment(moment,npc){
  const pool=MOMENT_COMMENTS[moment.theme]||MOMENT_COMMENTS.daily;
  if(npc.person==='毒舌'&&Math.random()<0.5){
    return pick(['啊？','哈哈哈好惨','所以呢','笑死我了','一般般']);
  }
  if(npc.person==='高冷'&&Math.random()<0.5){
    return pick(['嗯。','。','看到了。','好。']);
  }
  if(npc.person==='温柔'&&Math.random()<0.5){
    return pick(['抱抱。','会好的。','我懂你。','照顾好自己。']);
  }
  if(npc.person==='开朗'&&Math.random()<0.5){
    return pick(['哈哈哈哈哈','+1','太真实了','走一个']);
  }
  return pick(pool);
}

function generateMomentReactions(moment){
  const known=S.npcs.filter(n=>n.known&&n.aff>=5);
  if(!known.length)return;
  const sorted=[...known].sort((a,b)=>b.aff-a.aff);
  const top=sorted.slice(0,12);
  const shuffled=[...top].sort(()=>Math.random()-0.5);

  const likeCount=Math.min(shuffled.length,rnd(2,5));
  moment.likes=shuffled.slice(0,likeCount).map(n=>n.id);

  const remaining=shuffled.slice(likeCount);
  const commentCount=Math.min(remaining.length,rnd(1,2));
  remaining.slice(0,commentCount).forEach(npc=>{
    moment.comments.push({
      npcId:npc.id,
      text:pickMomentComment(moment,npc)
    });
  });

  /* 恋人优先 */
  const lover=S.npcs.find(n=>n.love>0&&n.known);
  if(lover){
    if(!moment.likes.includes(lover.id))moment.likes.unshift(lover.id);
    if(!moment.comments.some(c=>c.npcId===lover.id)){
      let loverText;
      if(moment.theme==='love'){
        loverText=pick(['……是说我吗？','我看到了。','为什么不当面说。','❤️']);
      }else if(moment.theme==='emo'){
        loverText=pick(['怎么了？','我在，跟我说说。','不要伤心。']);
      }else{
        loverText=pick(['嗯，我看到了。','❤️','下次一起。','注意休息。']);
      }
      moment.comments.unshift({npcId:lover.id,text:loverText});
    }
  }
}function publishMoment(theme,text){
  if(!S.myMoments)S.myMoments=[];
  const moment={
    id:'pm'+Date.now()+Math.floor(Math.random()*1000),
    theme:theme.id,
    themeName:theme.name,
    themeIcon:theme.icon,
    text:text,
    sem:S.semester,
    week:S.week,
    likes:[],
    comments:[]
  };
  S.myMoments.unshift(moment);
  if(S.myMoments.length>20)S.myMoments.pop();

  generateMomentReactions(moment);

  addEvent(`📱 你发了一条动态：「${text.length>16?text.slice(0,16)+'…':text}」`,'npc');
  S.mood=clamp(S.mood+3,0,100);
  render();

  const lines=[];
  if(moment.likes.length){
    const likeNames=moment.likes.map(id=>{
      const n=S.npcs.find(x=>x.id===id);
      return n?n.name:'';
    }).filter(Boolean);
    lines.push(`❤️ ${likeNames.join('、')} 点了赞`);
  }
  moment.comments.forEach(c=>{
    const n=S.npcs.find(x=>x.id===c.npcId);
    if(n)lines.push(`💬 ${n.name}：${c.text}`);
  });

  const bodyText=lines.length
    ?`${theme.icon} ${theme.name}\n\n「${text}」\n\n━━━━━━━━━━\n${lines.join('\n')}`
    :`${theme.icon} ${theme.name}\n\n「${text}」\n\n暂时还没有人回应。`;

  showModal('📱 动态已发布',bodyText,[
    {label:'心情 +3',dir:'up'}
  ]);
}

function openPostMoment(){
  const old=document.querySelector('.modal-wrap');
  if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.className='modal-wrap';
  let curTheme=null;

  function renderDialog(){
    const themeHTML=MOMENT_THEMES.map(t=>
      `<button class="chip ${curTheme&&curTheme.id===t.id?'on':''}" data-theme="${t.id}">${t.icon} ${t.name}</button>`
    ).join('');

    let contentHTML='';
    if(curTheme){
      const presetsHTML=curTheme.presets.map((p,i)=>
        `<button class="btn ghost" data-preset="${i}" style="width:100%;text-align:left;justify-content:flex-start;margin-bottom:6px;white-space:normal;line-height:1.5;padding:10px 14px">${escapeHtml(p)}</button>`
      ).join('');
      contentHTML=`
        <div class="mini" style="margin:10px 0 8px;color:#6a8ba3;font-weight:600">选择要发的文字：</div>
        ${presetsHTML}
        <button class="btn pink" data-preset="custom" style="width:100%">✍️ 自己写</button>
      `;
    }

    wrap.innerHTML=`
      <div class="modal-box">
        <div class="modal-title">✍️ 发动态</div>
        <div class="chips" style="margin-bottom:10px">${themeHTML}</div>
        <div class="modal-body" style="padding-right:0">${contentHTML||'<div class="mini" style="text-align:center;padding:14px 0;color:#8ba7bb">先选一个主题 ↑</div>'}</div>
        <button class="btn ghost" style="width:100%;margin-top:10px" id="cancelPost">取消</button>
      </div>
    `;
    document.body.appendChild(wrap);

    wrap.querySelectorAll('[data-theme]').forEach(b=>{
      b.onclick=()=>{
        curTheme=MOMENT_THEMES.find(t=>t.id===b.dataset.theme);
        renderDialog();
      };
    });
    wrap.querySelectorAll('[data-preset]').forEach(b=>{
      b.onclick=()=>{
        const v=b.dataset.preset;
        if(v==='custom'){
          wrap.remove();
          showCustomMomentInput(curTheme);
        }else{
          const idx=Number(v);
          wrap.remove();
          publishMoment(curTheme,curTheme.presets[idx]);
        }
      };
    });
    wrap.querySelector('#cancelPost').onclick=()=>wrap.remove();
  }

  renderDialog();
}

function renderMyMoment(m){
  const likes=(m.likes||[]).map(id=>{
    const n=S.npcs.find(x=>x.id===id);
    return n?esc(n.name):'';
  }).filter(Boolean);
  const comments=(m.comments||[]).map(c=>{
    const n=S.npcs.find(x=>x.id===c.npcId);
    if(!n)return '';
    return `<div class="mini" style="margin-top:6px;padding:6px 10px;background:#f0f9ff;border-radius:8px;color:#4b6b8a">
      <b>${esc(n.name)}</b>：${esc(c.text)}
    </div>`;
  }).join('');
  const likeHTML=likes.length
    ?`<div class="mini" style="margin-top:8px;color:#d6336c">❤️ ${likes.join('、')} 觉得很赞</div>`
    :'';
  return `
    <div class="card" style="margin-bottom:10px;border-left:4px solid #f9a8d4">
      <div class="mini" style="font-weight:700;color:#20536b">
        🌸 我 <span style="color:#8ba7bb;font-weight:400">· ${esc(m.themeIcon)} ${esc(m.themeName)}</span>

      ${likeHTML}
      ${comments}
    </div>
  `;
}

function genForumNick() {
  return `匿名${rnd(100, 999)}`;
}

/* 根据当前月份 / 节日 / 活动，返回当季专属帖子池 */
function buildSeasonalPool() {
  const pool = [];
  const month = currentMonth();
  if (SEASONAL_FORUM[month]) pool.push(...SEASONAL_FORUM[month]);

  const fest = getFestival();
  if (fest && FESTIVAL_FORUM[fest.id]) pool.push(...FESTIVAL_FORUM[fest.id]);

  if (isExamWeek()) {
    pool.push(
      {t:'考试周了，图书馆全是人',b:['早上八点来就没位置了。'],r:['+1','去自习室吧','我已经放弃了']},
      {t:'今晚通宵复习',b:['明天上午就考。'],r:['加油','我也在','别熬了，会猝死的']}
    );
  }
  if (S.activeCampusEvent) {
    pool.push(
      {t:`${S.activeCampusEvent.name}决赛这周`,b:['准备了好久了。'],r:['加油','去看','祝顺利']},
      {t:`${S.activeCampusEvent.name}报名了吗`,b:['下周就截止了。'],r:['报了','还在犹豫','没兴趣']}
    );
  }
  return pool;
}

function buildForumPosts(n) {
  const out = [];
  const seasonal = buildSeasonalPool();
  for (let i = 0; i < n; i++) {
    const useSeasonal = seasonal.length > 0 && Math.random() < 0.35;
    const topic = useSeasonal ? pick(seasonal) : pick(FORUM_TOPICS);

    const replies = [];
    const rc = rnd(0, 4);
    const replyPool = (topic.r && topic.r.length) ? topic.r : FORUM_REPLIES;
    for (let j = 0; j < rc; j++) {
      replies.push({ nick: genForumNick(), text: pick(replyPool) });
    }

    out.push({
      id: 'fp_' + Date.now() + '_' + i + '_' + rnd(100, 999),
      nick: genForumNick(),
      title: topic.t,
      body: pick(topic.b),
      sem: S.semester,
      week: S.week,
      replies,
      mine: false
    });
  }
  return out;
}

function loadForumData() {
  const key = S.semester * 100 + S.week;
  if (S._forumWeek === key) return;

  const firstTime = !S._forumWeek;
  S._forumWeek = key;

  const old = S.forumPosts || [];
  const mine = old.filter(p => p.mine).slice(0, 10);
  const others = old.filter(p => !p.mine);

  /* 旧帖随机沉没：第一周全清，之后保留约 40% */
  const kept = others.filter(() => Math.random() < (firstTime ? 0 : 0.4));

  /* 生成一批新帖（首周多给一些） */
  const fresh = buildForumPosts(firstTime ? rnd(18, 24) : rnd(8, 14));

  /* 按标题去重，避免同周重复 */
  const seen = new Set();
  const merged = [];
  for (const p of [...fresh, ...kept]) {
    if (seen.has(p.title)) continue;
    seen.add(p.title);
    merged.push(p);
  }

  /* 我的帖子永远在最上，新帖次之，旧帖沉底 */
  S.forumPosts = [...mine, ...merged].slice(0, 60);

  /* 若正在查看的帖子被冲掉，退回列表 */
  if (S._forumOpenId && !S.forumPosts.some(p => p.id === S._forumOpenId)) {
    S._forumOpenId = null;
  }
}

/* 帖子详情页 */
function vForumDetail(p) {
  const reps = (p.replies || []).map(r => `
    <div class="forum-reply">
      <span class="rk">${esc(r.nick)}</span>${esc(r.text)}
    </div>`).join('');

  return `
    <button class="btn ghost sm" data-act="forumBack" style="margin-bottom:12px">← 返回论坛</button>
    <div class="forum-detail-card${p.mine ? ' mine' : ''}">
      <div class="forum-head">
        <span class="forum-anon">${esc(p.nick)}</span>
        <span class="forum-time">第${p.sem}学期 第${p.week}周</span>
      </div>
      <div class="forum-detail-title">${esc(p.title)}</div>
      <div class="forum-detail-body">${esc(p.body)}</div>
      <div class="forum-detail-meta">
        <span>💬 ${(p.replies || []).length} 条回复</span>
        ${p.mine ? '<span style="color:#3aa886">· 我的帖子</span>' : ''}
      </div>
    </div>
    <div class="reply-title">全部回复（${(p.replies || []).length}）</div>
    ${reps || `<div class="forum-empty"><div class="ic">💭</div><div class="mini">还没有人回复。<br>你可以等一等。</div></div>`}
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" data-act="forumBack" style="width:100%">← 返回论坛</button>

function createForumPost(title, bodyText) {
  if (!S.forumPosts) S.forumPosts = [];
  const p = {
    id: 'fp_my_' + Date.now() + '_' + rnd(100, 999),
    nick: genForumNick(),
    title: title,
    body: bodyText,
    sem: S.semester,
    week: S.week,
    replies: [],
    mine: true
  };
  for (let i = 0; i < rnd(1, 3); i++) {
    p.replies.push({ nick: genForumNick(), text: pick(FORUM_REPLIES) });
  }
  S.forumPosts.unshift(p);
  if (S.forumPosts.length > 70) S.forumPosts.pop();

  addEvent(`🏫 你在校园论坛匿名发帖：「${title}」`, 'npc');
  S.mood = clamp(S.mood + 2, 0, 100);

  /* 发完直接进入详情页 */
  S._forumOpenId = p.id;
  render();

  showModal('🏫 帖子已发布',
    `「${title}」\n\n已经发到校园论坛上了，回复正在陆续出现……`,
    [{ label: '心情 +2', dir: 'up' }],
    () => { render(); });
}

  const breakupCount=(S.breakupHistory||[]).length;

  const loveTotal=breakupCount+(lover?1:0);

  const compAwards={国奖:0,省奖:0,校奖:0,无奖:0};
  S.compHistory.forEach(c=>{
    if(compAwards[c.award]!==undefined)compAwards[c.award]++;
  });

  const avgAff=knownNpcs.length
    ?Math.round(knownNpcs.reduce((a,c)=>a+c.aff,0)/knownNpcs.length)
    :0;

  let title='',desc='';

  else if(avg>=2.0){title='📜 顺利毕业';desc='磕磕绊绊，但你还是走到了终点。';}

    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')

    .replace(/'/g,'&#39;');
}

function saveKey(n){return 'campus_save_'+n;}

  return (v>=1&&v<=3)?v:0;

function getSlotInfo(n){
  try{
    const raw=SafeStorage.get(saveKey(n));
    if(!raw)return null;
    const d=JSON.parse(raw);
    const npcs = d.npcs || [];
    const lover = npcs.find(x=>x.love>0);
    const sem = d.semester||1;
    const grade = ['','大一','大二','大三','大四'][Math.min(4,Math.ceil(sem/2))]||'';
    const term = (sem % 2 === 1) ? '上' : '下';
    return {
      school:d.school||'???',
      name:(d.player&&d.player.name)?d.player.name:'???',
      major:(d.player&&d.player.major)?d.player.major.n:'',
      semester:sem,
      week:d.week||1,
      money:d.money||0,
      phase:d.phase||'game',
      grade:grade+term,
      loverName:lover?lover.name:'',
      sick:(d.sick||0)>0
    };
  }catch(e){return null;}
}
function getAllSlots(){
  return [1,2,3].map(n=>({n,info:getSlotInfo(n)}));
}

/* ---------- 导出辅助：探测能否用系统分享面板保存文件 ---------- */
function saveFileCanShare(){
  try{
    if(typeof navigator.share !== 'function') return false;
    if(typeof navigator.canShare !== 'function') return false;
    if(typeof File !== 'function') return false;
    const f = new File(['{}'], 'probe.json', { type:'application/json' });
    return !!navigator.canShare({ files:[f] });
  }catch(e){ return false; }
}

/* ---------- 导出辅助：Blob + a[内部工具] 下载 ---------- */
function 内部工具SaveBlob(blob, fileName){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.内部工具 = fileName;          /* ← 缺这一行就不会下载，只会"打开" */
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ---------- 导出辅助：文本兜底（微信内 / 下载失败时用） ---------- */
function showExportTextModal(slot, raw, tipHtml){
  let code = '';
  try{ code = btoa(unescape(encodeURIComponent(raw))); }
  catch(e){ showModal('编码失败', e.message||e, []); return; }
  const old = document.querySelector('.modal-wrap');
  if(old) old.remove();
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = '<div class="modal-box"><div class="modal-title">📋 存档文本（存档位 ' + slot + '）</div>'
    + '<div class="mini" style="margin-bottom:8px;color:#d97787;line-height:1.7">' + tipHtml + '</div>'
    + '<div class="modal-body" style="font-family:monospace;font-size:11px;word-break:break-all;user-select:all;max-height:40vh">' + escapeHtml(code) + '</div>'
    + '<button class="btn" style="width:100%;margin-top:10px" id="expOkT">确定</button></div>';
  document.body.appendChild(w);
  w.querySelector('#expOkT').onclick = ()=>{ w.remove(); render(); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code);
  }catch(e){}
}

  function fallback(){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
      ta.setAttribute('readonly','readonly');
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ ta.setSelectionRange(0, text.length); }catch(e){}
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){ ok=false; }
      document.body.removeChild(ta);
      if(cb) cb(ok);
    }catch(e){ if(cb) cb(false); }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ if(cb) cb(true); }).catch(function(){ fallback(); });
      return;
    }
  }catch(e){}
  fallback();
}

/* ===== 压缩：原生 gzip(CompressionStream)，不支持则回退紧凑明文 ===== */
/* 每段正文的安全长度（字符）。复制/粘贴上限按 6000 设计，这里留足头部与余量。 */
var SAVE_CHUNK_LEN = 4000;

/* gzip 后转 base64；成功 cb('GZ'+b64)，不支持/失败 cb(null) */
function gzipToB64(str, cb){
  try{
    if(typeof CompressionStream !== 'function' || typeof Blob === 'undefined'){ cb(null); return; }
    var stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    new Response(stream).arrayBuffer().then(function(buf){
      var bytes = new Uint8Array(buf), bin = '', CH = 0x8000;
      for(var i=0;i<bytes.length;i+=CH){ bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH)); }
      cb('GZ' + btoa(bin));
    }).catch(function(){ cb(null); });
  }catch(e){ cb(null); }
}

/* base64(gzip) 解回字符串 */
function b64GzipToStr(b64, cb){
  try{
    if(typeof DecompressionStream !== 'function'){ cb(null); return; }
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for(var i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    new Response(stream).text().then(function(t){ cb(t); }).catch(function(){ cb(null); });
  }catch(e){ cb(null); }
}

/* 生成编码串：优先 'GZ'+base64(gzip) ；降级 'JS'+紧凑JSON明文（无前缀冲突） */
function buildSaveEncoded(raw, cb){
  var data = JSON.parse(raw);
  data._exportVersion = 3;
  data._exportTime = new Date().toISOString();
  var code = JSON.stringify(data);                 /* 紧凑 JSON，无缩进无换行 */
  gzipToB64(code, function(enc){
    if(enc && enc.length < code.length) cb(enc);   /* 压缩确实更小才用 gzip */
    else cb('JS' + code);                          /* 否则走明文（仍比旧 Base64 小 ~33%） */
  });
}

/* 把编码串按固定安全长度切成 N 段，每段带 SAVE@i@N@ 头 */
function splitSaveChunks(enc){
  var N = Math.max(1, Math.ceil(enc.length / SAVE_CHUNK_LEN));
  var per = Math.ceil(enc.length / N), segs = [];
  for(var i=0;i<N;i++){
    var part = enc.slice(i*per, (i+1)*per);
    if(part) segs.push('SAVE@'+(i+1)+'of'+N+'@'+part);
  }
  return segs;
}

/* 从拼接文本里解析分段：用 SAVE@ 头的位置切片段体，正则只匹配头部，段体原样截取（解决贪婪匹配和压缩头字符冲突）。
   齐全返回 { enc, total }；缺段返回 { missing,total,missed }；无 SAVE@ 头返回 null。 */
function parseSaveSegments(text){
  var re = /SAVE@(\d+)of(\d+)@/g, m, hits = [];
  while((m = re.exec(text))){ hits.push({ start:m.index, end:re.lastIndex, no:Number(m[1]), total:Number(m[2]) }); }
  if(!hits.length) return null;
  var N = 0, i;
  for(i=0;i<hits.length;i++){ if(hits[i].total>N) N=hits[i].total; }
  var map = {};
  for(i=0;i<hits.length;i++){
    var s = hits[i].end, e = (i+1<hits.length) ? hits[i+1].start : text.length;
    var seg = text.slice(s, e);
    if(seg.indexOf('\n')>=0) seg = seg.slice(0, seg.indexOf('\n'));
    map[hits[i].no] = seg;
  }
  for(i=1;i<=N;i++){ if(!map[i]) return { missing:true, total:N, missed:i }; }
  var enc = ''; for(i=1;i<=N;i++){ enc += map[i]; }
  return { enc: enc, total: N };
}

/* 把"完整编码串"还原成对象，自动识别 GZ / JS / 旧版整串，结果走 cb */
function decodeSaveEncoded(enc, cb){
  var parsed;
  if(enc.indexOf('GZ') === 0){                 /* gzip + base64 */
    b64GzipToStr(enc.slice(2), function(json){
      if(json){ try{ cb(JSON.parse(json)); return; }catch(e){} }
      cb(null);
    });
    return;
  }
  if(enc.indexOf('JS') === 0){                 /* 紧凑 JSON 明文 */
    try{ cb(JSON.parse(enc.slice(2))); return; }catch(e){ cb(null); return; }
  }
  /* 兜底：当成旧版整串 base64 */
  try{ cb(JSON.parse(decodeURIComponent(escape(atob(enc))))); return; }catch(e){ cb(null); }
}

function importCurrentSave(isFromStart = false){
  var old = document.querySelector('.modal-wrap'); if(old) old.remove();
  var wrap = document.createElement('div'); wrap.className='modal-wrap';
  var targetSlot = getCurrentSlot() || 1;

  wrap.innerHTML =
    '<div class="modal-box">'
    + '<div class="modal-title">📥 导入存档</div>'
    + '<div class="mini" style="margin-bottom:10px;color:#8ba7bb;line-height:1.7">'
    + '把导出的存档段（每段以 <b style="color:#e6c07b">SAVE@</b> 开头）全部粘进下面的框里。可<b>分多次粘贴</b>，会自动累加，点【确认导入】时会校验是否齐全。<br>'
    + '导入会<b style="color:#d97787">覆盖对应的存档位</b>。</div>'
    + (isFromStart ?
      '<div class="chips" style="margin-bottom:12px">'
      + '<span style="font-size:13px;color:#6a8ba3;font-weight:600">选择要覆盖的槽位：</span>'
      + '<button class="chip on" data-slot="1">存档 1</button>'
      + '<button class="chip" data-slot="2">存档 2</button>'
      + '<button class="chip" data-slot="3">存档 3</button></div>' : '')
    + '<textarea class="inp" id="impInput" maxlength="999999" style="min-height:140px;resize:vertical;font-family:monospace;font-size:11px;line-height:1.5" placeholder="粘贴 SAVE@1ofN@... 各段，或旧的整串 Base64 / JSON"></textarea>'
    + '<div class="row" style="margin-top:12px">'
    + '<button class="btn" id="impOk" style="flex:1">确认导入</button>'
    + '<button class="btn ghost" id="impCancel">取消</button></div>'
    + '</div>';
  document.body.appendChild(wrap);

  if(isFromStart){
    wrap.querySelectorAll('[data-slot]').forEach(function(b){
      b.onclick = function(){
        wrap.querySelectorAll('[data-slot]').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); targetSlot = Number(b.dataset.slot);
      };
    });
  }

  wrap.querySelector('#impCancel').onclick = function(){ wrap.remove(); render(); };
  wrap.querySelector('#impOk').onclick = function(){
    var text = wrap.querySelector('#impInput').value.trim();
    if(!text){ alert('先粘贴存档段'); return; }

    var seg = parseSaveSegments(text);
    if(seg && seg.missing){
      alert('缺少第 '+seg.missed+' 段（共 '+seg.total+' 段）。请补齐后再导入。'); return;
    }
    if(seg && seg.enc){
      decodeSaveEncoded(seg.enc, function(parsed){
        if(!parsed){ alert('各段拼接后无法解析，请检查每段是否都复制完整、没有漏字符。'); return; }
        doImport(parsed, targetSlot, isFromStart, wrap);
      });
      return;
    }

    /* 兼容旧版：整串 JSON / 整串 Base64 */
    var parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(!parsed){ try{ parsed = JSON.parse(decodeURIComponent(escape(atob(text)))); }catch(e){} }
    if(!parsed){ alert('无法解析：请粘贴 SAVE@... 各段，或旧的整串 Base64 / JSON'); return; }
    doImport(parsed, targetSlot, isFromStart, wrap);
  };
}

/* 导入通用逻辑（文件/文本共用） */
function doImport(parsed, targetSlot, isFromStart, wrapEl){
  if(!parsed || !parsed.player || !parsed.player.name){
    alert('这不是一份有效的存档（缺少玩家信息）'); return;
  }
  if(!confirm('导入将覆盖存档位 ' + targetSlot + '，确定吗？')) return;
  setCurrentSlot(targetSlot);
  const migrated = migrateSave(parsed);
  try{ SafeStorage.set(saveKey(targetSlot), JSON.stringify(migrated)); }catch(e){}
  if(wrapEl) wrapEl.remove();
  if (isFromStart) {
    S = newState();
    S.phase = 'start';
    render();
    showModal('📥 导入成功', '存档已成功恢复到存档位 ' + targetSlot + '！\n请点击该存档的【继续】按钮进入游戏。', []);
  } else {
    S = migrated;
    showModal('📥 导入成功',
      '存档已导入。\n\n学校：' + esc(S.school) + '\n角色：' + esc(S.player.name) + '\n进度：第 ' + S.semester + ' 学期 第 ' + S.week + ' 周',
      [], ()=>{ render(); });
  }
}

/* ===== NPC 主动邀约相关函数（第6项） ===== */
function pickNpcInviteScene(npc){
  /* 优先级：恋人专属 > 身份专属 > 社团专属 > 通用 */
  if(npc.love>0 && Math.random()<0.55){
    return pick(NPC_INVITE_LOVER_SCENES);
  }
  if(NPC_INVITE_BY_ROLE[npc.role] && Math.random()<0.6){
    return pick(NPC_INVITE_BY_ROLE[npc.role]);
  }
  if(npc.club && NPC_INVITE_BY_CLUB[npc.club] && Math.random()<0.6){
    return pick(NPC_INVITE_BY_CLUB[npc.club]);
  }
  return pick(NPC_INVITE_SCENES);
}

function tryNpcInvite(){
  if(!S._npcInvitedThisWeek)S._npcInvitedThisWeek=[];
  const eligible=S.npcs.filter(n=>
    n.known &&
    n.aff>=70 &&
    !n.isEx &&
    n.role!=='老师' && n.role!=='辅导员' &&
    !S._npcInvitedThisWeek.includes(n.id)
  );
  if(!eligible.length)return null;
  /* 30% 概率本周有邀约 */
  if(Math.random()>0.3)return null;
  return pick(eligible);
}

function showNpcInvite(npc,cb){
  const pron=getPronoun(npc);
  const scene=pickNpcInviteScene(npc);
  const inviteLine=scene.invite
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub);

  const body=`${npc.name} 忽然叫住你。\n\n${inviteLine}`;

  showChoice(
    `${scene.icon} ${npc.name} 的邀约`,
    body,
    [
      {label:'答应',value:'yes'},
      {label:'委婉拒绝',value:'no',cls:'ghost'}
    ],
    (v)=>{
      S._npcInvitedThisWeek=S._npcInvitedThisWeek||[];
      S._npcInvitedThisWeek.push(npc.id);

      if(v==='yes'){
        const before=snapshot();
        const affBefore=npc.aff;
        const gain=rnd(6,12);
        npc.aff=clamp(npc.aff+gain,0,100);
        S.mood=clamp(S.mood+8,0,100);
        S.energy=clamp(S.energy-6,0,100);

        const acceptText=scene.accept
          .replace(/\{n\}/g,npc.name)
          .replace(/\{pr\}/g,pron.sub);

        addEvent(`✨ ${npc.name} 邀你${scene.name}，你答应了。好感 +${npc.aff-affBefore}。`,'npc');

        const after=snapshot();
        const changes=diffStats(before,after);
        changes.push({label:`好感 +${npc.aff-affBefore}`,dir:'up'});

        gotoScene(`${scene.icon} 和 ${npc.name} · ${scene.name}`,acceptText,changes,()=>{if(cb)cb();});
      }else{
        const declineText=scene.decline
          .replace(/\{n\}/g,npc.name)
          .replace(/\{pr\}/g,pron.sub);

        /* 拒绝不减好感，只有玩家自己心情 -2 */
        S.mood=clamp(S.mood-2,0,100);

        addEvent(`😖 ${npc.name} 邀你${scene.name}，你婉拒了。`,'sys');

        gotoScene(`${scene.icon} 婉拒了 ${npc.name}`,
          `你犹豫了一下，还是婉拒了。\n\n${declineText}`,
          [{label:'心情 -2',dir:'down'}],
          ()=>{if(cb)cb();});
      }
    }
  );
}

/* ===== 季节专属事件触发（第9项） ===== */
function trySeasonEvent(){
  const month=currentMonth();
  const pool=SEASON_EVENTS[month];
  if(!pool || !pool.length)return null;
  const used=S._seasonEventsUsed||[];
  const available=pool.filter(e=>!used.includes(e.id));
  if(!available.length)return null;
  /* 每周约 12% 概率触发 */
  if(Math.random()>0.12)return null;
  return pick(available);
}

function showSeasonEvent(ev){
  if(!ev)return;
  const r={title:ev.title,body:ev.body,changes:ev.changes||[],onOk:ev.onOk};
  S._seasonEventsUsed=S._seasonEventsUsed||[];
  S._seasonEventsUsed.push(ev.id);
  showModal(r.title,r.body,r.changes,()=>{
    if(r.onOk)r.onOk();
    render();
  });
}

function triggerDaily(cb){
  if(!S._recentDailyEvents) S._recentDailyEvents = [];
  
  const pool = DAILY_EVENTS.filter(e => {
    if(S._recentDailyEvents.includes(e.id)) return false; // 过滤掉近期出现过的
    if(e.id==='friend')return S.npcs.some(n=>n.known);
    return true;
  });
  
  // 如果全看过了，清空记忆，重新开始
  if(!pool.length){
    S._recentDailyEvents = [];
    if(cb)cb();
    return;
  }
  
  const ev = pick(pool);
  S._recentDailyEvents.push(ev.id);
  if(S._recentDailyEvents.length > 7) S._recentDailyEvents.shift(); // 最多记住最近7个
  
  const r=ev.roll();
  if(!r){if(cb)cb();return;}
  showModal(r.title,r.body,r.changes||[],()=>{
    if(r.onOk)r.onOk();
    if(cb)cb();
  });

// 封装初始化函数，加入容错重试
function bootGame() {
  S = newState();
  try {
    const metaRaw = SafeStorage.get('campus_meta'); 
    if(metaRaw){
      const meta = JSON.parse(metaRaw);
      S.codexEndings = meta.codexEndings || [];
      S.codexNpcs = meta.codexNpcs || [];
    }
  } catch(e){}
  
  // 如果是 X5 内核，给 body 加标记触发 CSS 降级
  if (isX5WebView) {
    document.body.classList.add("x5-env");
  }
  
  // #app 不存在，延迟重试，兼容 X5 内核加载时序错乱
  if(!document.querySelector("#app")){
    setTimeout(bootGame, 180); 
    return;
  }
  
  render();
}

/* ===== 页面关闭 / 切后台时尽量保存 =====
   只在游戏进行中（phase==='game' 或 'scene'、'vacation' 等 gameplay 状态）触发。
   存盘/读档页、主菜单、毕业页不保存。
   加节流，避免 visibilitychange 频繁触发时反复写 localStorage。 */
let _lastAutoSaveMs = 0;
function _saveOnExit(){
  try{
    if(!S) return;
    const gPhase = ['game','scene','vacation','clubActivity','clubfair'];
    if(!gPhase.includes(S.phase)) return;
    const now = Date.now();
    if(now - _lastAutoSaveMs < 1500) return;   // 1.5 秒内不重复写
    _lastAutoSaveMs = now;
    let _slot = getCurrentSlot();
    if(!_slot){ _slot = 1; setCurrentSlot(1); }
    SafeStorage.set(saveKey(_slot), JSON.stringify(S));
    saveMeta();
  }catch(e){}
}
window.addEventListener('beforeunload', _saveOnExit);
window.addEventListener('pagehide', _saveOnExit);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) _saveOnExit();
});

// 启动游戏
bootGame();
