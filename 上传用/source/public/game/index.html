<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>青春校园模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#e6f7f1 0%,#e6f0fb 45%,#fdf1e8 100%);
  background-attachment:fixed;color:#33415c;min-height:100vh;
  display:flex;justify-content:center;font-size:15px;line-height:1.65;
}
#app{width:100%;max-width:880px;padding:14px 14px 40px}
h1,h2,h3{font-weight:700;color:#20536b}
.title{font-size:26px;text-align:center;margin:26px 0 6px;letter-spacing:2px}
.sub{text-align:center;color:#7f9bb0;font-size:13px;margin-bottom:22px}
.card{
  background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;
  box-shadow:0 4px 18px rgba(120,170,200,.13);
}
.lbl{display:block;font-size:13px;color:#6a8ba3;margin-bottom:8px;font-weight:600;letter-spacing:.5px}
.inp{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #dbeafe;
  font-size:16px;font-family:inherit;color:#33415c;background:#fbfeff;outline:none;transition:.2s;
}
.inp:focus{border-color:#6ee7b7;background:#fff;box-shadow:0 0 0 3px rgba(110,231,183,.18)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row.center{justify-content:center}
/* ===== 首页固定布局 ===== */
.start-overlay{
  position:fixed;
  top: 0; right: 0; bottom: 0; left: 0; /* 替换 inset:0，兼容老内核 */
  height: 100%;
  z-index:5;
  background:
    radial-gradient(circle at 15% 10%,rgba(110,231,183,.35),transparent 45%),
    radial-gradient(circle at 85% 15%,rgba(251,191,36,.28),transparent 45%),
    radial-gradient(circle at 50% 95%,rgba(196,181,253,.30),transparent 50%),
    linear-gradient(165deg,#f0fbf6 0%,#eaf3fb 50%,#fdf3ea 100%);
  display:flex;justify-content:center;
  overflow:hidden;
}
.start-overlay::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.4px);
  background-size:22px 22px;
  opacity:.55;pointer-events:none;
}
.start-overlay-inner{
  position:relative;z-index:1;
  width:100%;max-width:880px;
  display:flex;flex-direction:column;
  padding:16px 16px 12px;overflow:hidden;min-height:0;
}
.start-header{
  flex:0 0 auto;text-align:center;
  padding:22px 0 14px;position:relative;
}
.start-badge{
  display:inline-block;
  padding:5px 14px;border-radius:20px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-size:11.5px;font-weight:700;letter-spacing:1.5px;
  color:#2f8f86;margin-bottom:12px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 2px 10px rgba(110,231,183,.22);
}
.start-logo{
  font-size:58px;line-height:1;
  margin-bottom:8px;
  filter:drop-shadow(0 6px 14px rgba(249,168,212,.4));
  animation:floaty 3.4s ease-in-out infinite;
}
@keyframes floaty{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.start-title{
  font-size:24px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,#2f8f86 0%,#4f8fd4 55%,#d97787 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.start-sub{
  font-size:12.5px;color:#7f9bb0;letter-spacing:2px;
}
.start-slots{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin-top:6px;padding:4px 6px 8px 2px;
}
.start-slots::-webkit-scrollbar{width:5px}
.start-slots::-webkit-scrollbar-thumb{background:#c7d9e6;border-radius:3px}
.start-footer{flex:0 0 auto;padding-top:8px}

/* 存档卡片 */
.slot-card{
  position:relative;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:18px;padding:14px 16px;margin-bottom:12px;
  box-shadow:0 6px 22px rgba(120,170,200,.16);
  border:1px solid rgba(255,255,255,.9);
  overflow:hidden;transition:.18s;
}
.slot-card.filled{border-left:none}
.slot-card.filled::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,#6ee7b7,#4cc4d4);
}
.slot-card.empty::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,#e2eef7,#cbd5e1);
}
.slot-card.empty{opacity:.88}
.slot-row{display:flex;align-items:center;gap:12px}
.slot-ic{
  width:46px;height:46px;flex:0 0 auto;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  background:linear-gradient(135deg,#e6f7f1,#e6f0fb);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);
}
.slot-card.filled .slot-ic{
  background:linear-gradient(135deg,#d1fae5,#cffafe);
}
.slot-ic-empty{
  background:linear-gradient(135deg,#f1f5f9,#e2e8f0);
}
.slot-info{flex:1;min-width:0}
.slot-name{
  font-weight:700;color:#20536b;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slot-meta{
  font-size:12px;color:#8ba7bb;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slot-actions{display:flex;gap:8px;margin-top:12px}
.slot-actions .btn{flex:1}
.slot-tag{
  display:inline-block;
  padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:700;
  background:#effbf5;color:#3aa886;margin-right:5px;
}
.slot-tag.empty{background:#f1f5f9;color:#94a3b8}
/* ===== 事件页固定布局 ===== */
.ev-page{
  display:flex;flex-direction:column;
  height:calc(100vh - 230px);
  height:calc(100dvh - 230px); /* 兼容移动端动态视口 */
  min-height:360px;
  overflow:hidden;
}
.ev-top{flex:0 0 auto}
.ev-scroll{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:6px;margin-top:2px;
}
.ev-scroll::-webkit-scrollbar{width:5px}
.ev-scroll::-webkit-scrollbar-thumb{background:#c7d9e6;border-radius:3px}
.ev-bottom{flex:0 0 auto;padding-top:10px}
/* ===== 新增：横向快捷任务条 ===== */
.quick-tasks-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-top: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.quick-tasks-scroll::-webkit-scrollbar { display: none; }
.quick-task-card {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  color: #20536b;
  box-shadow: 0 2px 8px rgba(120,170,200,.1);
  border: 1px solid #eef5f9;
  cursor: pointer;
  transition: .15s;
}
.quick-task-card:active { transform: scale(.96); }
.quick-task-card.comp { border-left: 3px solid #fdba74; }
.quick-task-card.club { border-left: 3px solid #4f46e5; }
.quick-task-card.hw { border-left: 3px solid #8b5cf6; }
.quick-task-card.sick { border-left: 3px solid #dc2626; background: #fef2f2; color: #b91c1c; }
.quick-task-card.exam { border-left: 3px solid #f59e0b; background: #fffbeb; color: #b45309; }
/* ===== 校园广播条 ===== */
.broadcast-bar{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#f5f7ff,#eef2ff);
  border:1.5px solid #e0e7ff;border-radius:14px;
  padding:7px 12px;margin-bottom:10px;
  font-size:12.5px;color:#4f46e5;
  overflow:hidden;position:relative;
}
.broadcast-ic{
  flex:0 0 auto;font-size:14px;
  animation:bcPulse 2.2s ease-in-out infinite;
}
@keyframes bcPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.15);opacity:.75}
}
.broadcast-track{
  flex:1;overflow:hidden;position:relative;height:18px;
  min-width:0;
}
.broadcast-text{
  position:absolute;top:0;left:0;
  display:inline-block;white-space:nowrap;
  font-weight:600;line-height:18px;
  will-change:transform;
}
</style><style>
.btn{
  border:none;border-radius:12px;padding:11px 20px;font-size:15px;cursor:pointer;
  background:linear-gradient(135deg,#5ed7a8,#4cc4d4);color:#fff;font-weight:600;
  box-shadow:0 3px 12px rgba(76,196,212,.32);transition:.15s;font-family:inherit;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:#3aa99f;border:1.5px solid #b9ece2;box-shadow:none}
.btn.warn{background:linear-gradient(135deg,#fda4af,#fb7185);box-shadow:0 3px 12px rgba(251,113,133,.3)}
.btn.pink{background:linear-gradient(135deg,#f9a8d4,#fb7185);box-shadow:0 3px 12px rgba(251,113,133,.3)}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 3px 12px rgba(245,158,11,.3)}
.btn.big{padding:14px 24px;font-size:16px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:7px 15px;border-radius:20px;border:1.5px solid #dbeafe;background:#fff;
  font-size:14px;cursor:pointer;color:#5b7a94;transition:.15s;font-family:inherit;
}
.chip.on{background:linear-gradient(135deg,#5ed7a8,#4cc4d4);color:#fff;border-color:transparent;font-weight:600}
.chip:active{transform:scale(.95)}
</style><style>
.modal-wrap{
  position:fixed;
  top: 0; right: 0; bottom: 0; left: 0; /* 替换 inset:0 */
  background:rgba(30,50,70,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:99;padding:14px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:#fff;border-radius:20px;
  padding:18px 18px 14px;
  max-width:480px;width:100%;
  box-shadow:0 20px 60px rgba(30,60,90,.35);
  animation:pop .22s ease;
  max-height:82vh;
  display:flex;flex-direction:column;
  overflow:hidden;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:16px;font-weight:700;color:#20536b;margin-bottom:10px;flex:0 0 auto}
.modal-body{
  font-size:13px;color:#4b6b8a;line-height:1.72;
  margin-bottom:12px;word-break:break-word;overflow-wrap:anywhere;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  flex:1 1 auto;min-height:0;padding-right:6px;
}
.modal-body::-webkit-scrollbar{width:5px}
.modal-body::-webkit-scrollbar-thumb{background:#c7d9e6;border-radius:3px}
.modal-changes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;flex:0 0 auto}
.chg{padding:4px 10px;border-radius:10px;font-size:12.5px;font-weight:600}
.chg.up{background:#effbf5;color:#3aa886}
.chg.down{background:#fff1f3;color:#d97787}
.chg.love{background:#fff0f6;color:#d6336c}
.chg.money{background:#fffbeb;color:#b45309}
</style><style>
.game-fixed{
  position:sticky;top:0;z-index:50;
  margin:-14px -14px 12px;
  padding:14px 14px 0;
  background:linear-gradient(160deg,#e6f7f1 0%,#e6f0fb 45%,#fdf1e8 100%);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:8px;
  box-shadow:0 4px 16px rgba(120,170,200,.13);flex-wrap:wrap;
}
.school{font-weight:700;color:#20536b;font-size:15px}
.weekinfo{font-size:13px;color:#7f9bb0}
.ap{font-size:13px;color:#f59e0b;font-weight:700;letter-spacing:2px}
.money-top{font-size:13px;color:#b45309;font-weight:700}
.timebar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(135deg,#f0fdfa,#e6f6ff);
  border:1.5px solid #d8f3ee;border-radius:14px;
  padding:9px 14px;margin-bottom:12px;font-size:12.5px;
  color:#2f8f86;font-weight:600;flex-wrap:wrap;
}
.timebar span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 15px;border-radius:20px;background:#fff;border:1.5px solid #e2eef7;
  font-size:14px;cursor:pointer;color:#5b7a94;transition:.15s;font-family:inherit;
}
.tab.on{background:linear-gradient(135deg,#5ed7a8,#4cc4d4);color:#fff;border-color:transparent;font-weight:600}
.content{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style><style>
.ev{
  background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:14px;
  border-left:4px solid #dbeafe;box-shadow:0 2px 8px rgba(120,170,200,.08);
}
.ev.sys{border-left-color:#fbbf24;background:#fffdf5;color:#a16207;font-weight:600;font-size:13px}
.ev.exam{border-left-color:#fb7185;background:#fff5f6}
.ev.npc{border-left-color:#c4b5fd;background:#faf8ff}
.ev.good{border-left-color:#6ee7b7;background:#f4fffb}
.ev.bad{border-left-color:#94a3b8;background:#f8fafc}
.ev.love{border-left-color:#f9a8d4;background:#fff5fa}
.ev.club{border-left-color:#a5b4fc;background:#f5f7ff}
.ev.money{border-left-color:#fbbf24;background:#fffbeb}
.ev.break{border-left-color:#a1a1aa;background:#f8f8fa;color:#52525b}
</style><style>
.place{
  background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;
  box-shadow:0 4px 16px rgba(120,170,200,.1);cursor:pointer;transition:.15s;
}
.place:active{transform:scale(.99)}
.place-h{display:flex;align-items:center;gap:10px;font-weight:700;color:#20536b}
.place-h .ic{font-size:20px}
.place-h .arw{margin-left:auto;color:#bcd4e6;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{
  padding:9px 15px;border-radius:12px;background:linear-gradient(135deg,#f0fdfa,#e6f6ff);
  border:1.5px solid #d8f3ee;font-size:14px;color:#2f8f86;cursor:pointer;font-family:inherit;
  transition:.15s;font-weight:600;
}
.act:active{transform:scale(.95);background:#dffaf3}
.act.social{background:linear-gradient(135deg,#fdf4ff,#fbe8ff);border-color:#f5d0fe;color:#a855c7}
.act.club{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-color:#c7d2fe;color:#4f46e5}
.act.comp{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fed7aa;color:#c2410c}
.act.dorm{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border-color:#bae6fd;color:#0369a1}
.act.money{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a;color:#b45309}
</style><style>
.stat{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.stat-k{width:52px;color:#6a8ba3;flex:0 0 auto}
.bar{flex:1;height:9px;background:#eef5f9;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#6ee7b7,#38bdf8);transition:width .4s}
.bar i.love{background:linear-gradient(90deg,#f9a8d4,#fb7185)}
.bar i.comp{background:linear-gradient(90deg,#fdba74,#fb923c)}
.stat-v{width:34px;text-align:right;color:#4b6b8a;font-weight:700;flex:0 0 auto}
.tag{display:inline-block;padding:3px 10px;border-radius:10px;background:#eef7ff;color:#4b8db8;font-size:12px;margin:3px 5px 3px 0}
.tag.pink{background:#fff1f3;color:#d97787}
.tag.green{background:#effbf5;color:#3aa886}
.tag.gold{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#b45309;font-weight:700}
.tag.purple{background:#f5f0ff;color:#8b5cf6}
.tag.club{background:#eef2ff;color:#4f46e5}
.tag.comp{background:linear-gradient(135deg,#fff7ed,#ffedd5);color:#c2410c;font-weight:700}
.tag.sick{background:#fee2e2;color:#dc2626;font-weight:700}
.tag.rel{background:#ecfdf5;color:#059669}
.tag.ex{background:#f4f4f5;color:#52525b;font-weight:700}
</style><style>
.npc{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s;
  box-shadow:0 3px 12px rgba(120,170,200,.1);
}
.npc:active{transform:scale(.99)}
.npc.on{border:2px solid #6ee7b7;background:#f6fffc}
.npc.marked{box-shadow:0 3px 14px rgba(245,158,11,.25);border-left:4px solid #f59e0b}
.npc.ex{background:linear-gradient(135deg,#fafafa,#fff);border-left:4px solid #a1a1aa}
.av{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;flex:0 0 auto;position:relative;
}
.av .star{position:absolute;top:-3px;right:-3px;font-size:12px}
.npc-n{font-weight:700;color:#20536b;font-size:14.5px}
.npc-d{font-size:12px;color:#8ba7bb}
.npc-a{margin-left:auto;font-size:12px;color:#f59e0b;font-weight:700;flex:0 0 auto}
.lock{opacity:.45;filter:grayscale(.6)}
</style><style>
.sect-title{font-size:15px;font-weight:700;color:#20536b;margin:16px 0 10px;display:flex;align-items:center;gap:6px}
.sect-title::before{content:'';width:4px;height:15px;border-radius:3px;background:linear-gradient(#5ed7a8,#4cc4d4)}
.mini{font-size:12.5px;color:#8ba7bb;line-height:1.7}
.divider{height:1px;background:#eef5f9;margin:12px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:9px;background:#f1f9ff;color:#4b8db8;font-size:12px;margin-right:6px}
.start-btns{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.club-card{
  background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;
  box-shadow:0 4px 16px rgba(120,170,200,.1);border-left:5px solid #a5b4fc;
}
.scene-card{
  background:linear-gradient(135deg,#f8faff,#eef2ff);
  border-radius:16px;padding:16px 18px;margin-bottom:12px;
  border-left:5px solid #818cf8;
  font-size:13px;color:#4b5e7a;line-height:1.85;
  font-style:italic;
}
.task-card{
  background:linear-gradient(135deg,#f5f7ff,#eef2ff);
  border-radius:16px;padding:14px 16px;margin-bottom:12px;
  border-left:5px solid #4f46e5;
}
.task-card .task-title{font-weight:700;color:#4f46e5;font-size:14px;margin-bottom:6px}
</style><style>
.dorm-act{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;
  box-shadow:0 3px 12px rgba(120,170,200,.1);
}
.dorm-act:active{transform:scale(.99);background:#f6fffc}
.dorm-act .ic{font-size:26px;flex:0 0 auto}
.dorm-act .info{flex:1}
.dorm-act .name{font-weight:700;color:#20536b;font-size:14.5px}
.dorm-act .desc{font-size:12px;color:#8ba7bb;line-height:1.5}
.dorm-act .arrow{color:#bcd4e6;font-size:16px;flex:0 0 auto}
.mark-btn{
  background:transparent;border:none;cursor:pointer;
  font-size:13px;padding:0 4px;margin-left:4px;
  color:#f59e0b;font-family:inherit;
  vertical-align:middle;line-height:1;
}
.mark-btn:active{transform:scale(.9)}
.scene-page-card{
  background:#fff;border-radius:20px;padding:22px 20px;
  box-shadow:0 4px 20px rgba(120,170,200,.16);
  border-top:5px solid #5ed7a8;
  margin-bottom:14px;
}
.scene-page-card.break-scene{border-top-color:#a1a1aa}

// ===== 安全的本地存储封装（防止 X5 隐私模式卡死）=====
const SafeStorage = {
  get(key) {
    try { 
      let val = localStorage.getItem(key);
      // 如果主存档没了，尝试读取备份
      if (!val && localStorage.getItem(key + '_backup')) {
        val = localStorage.getItem(key + '_backup');
      }
      return val;
    } catch (e) { return null; }
  },
  set(key, val) {
    try { 
      localStorage.setItem(key, val); 
      // 同时写入备份
      localStorage.setItem(key + '_backup', val); 
    } catch (e) { console.warn('Storage set error', e); }
  },
  remove(key) {
    try { 
      localStorage.removeItem(key); 
      localStorage.removeItem(key + '_backup');
    } catch (e) {}
  }
};

function rollWeather(){
  const key = S.semester*16+S.week;
  if(S.weatherWeek === key && S.weather) return;   // 本周已投过，直接返回
  const m=currentMonth();
  const w=MONTH_WEATHER[m]||MONTH_WEATHER[10];
  const pool=[];
  Object.keys(w).forEach(k=>{
    for(let i=0;i<w[k];i++)pool.push(k);
  });
  S.weather=pick(pool);
  S.weatherWeek=key;
}

const OUTDOOR_PLACES=[
  '操场',
  '江边','游乐园','海边','山顶','夜市','公园'
];

function isOutdoor(place){
  return OUTDOOR_PLACES.includes(place);
}function outdoorEncounterMul(place){
  if(!isOutdoor(place))return 1;
  const w=getWeather();
  if(!w)return 1;
  if(w.id==='rain')return 0.35;
  if(w.id==='snow')return 0.25;
  if(w.id==='wind')return 0.6;
  if(w.id==='sunny')return 1.15;
  return 1;
}

function outdoorWeatherLine(place){
  if(!isOutdoor(place))return '';
  const w=getWeather();
  if(!w)return '';
  if(w.id==='sunny')return `\n\n（${w.icon} 今天天气不错，阳光落在身上暖洋洋的。）`;
  if(w.id==='cloudy')return `\n\n（${w.icon} 天色阴沉，不冷不热，很适合在外面待着。）`;
  if(w.id==='rain')return `\n\n（${w.icon} 雨一直没停，地面湿漉漉的。）`;
  if(w.id==='snow')return `\n\n（${w.icon} 雪下得不大，但地上已经白了一层。）`;
  if(w.id==='wind')return `\n\n（${w.icon} 风很大，说话得凑近一点才能听清。）`;
  return '';
}

function weatherEffect(place,act){
  const w=getWeather();
  const eff={skillMul:1, moodDelta:0, energyDelta:0, note:''};
  if(!w) return eff;

  if(!isOutdoor(place)){
    if(w.id==='snow' && (act==='自习'||act==='专业课')){
      eff.skillMul=1.15;
      eff.note=`\n\n（${w.icon} 外面飘着雪，屋里暖气很足，你反而更容易静下心。）`;
    }else if(w.id==='rain' && act==='自习'){
      eff.note=`\n\n（${w.icon} 雨声淅淅沥沥，反而成了白噪音。）`;
    }
    return eff;
  }

  if(w.id==='sunny'){
    eff.skillMul=1.10; eff.moodDelta=2;
    eff.note=`\n\n（${w.icon} 阳光正好，活动起来很舒服。）`;
  }else if(w.id==='cloudy'){
    eff.note=`\n\n（${w.icon} 天色阴沉，不冷不热，正适合活动。）`;
  }else if(w.id==='rain'){
    eff.skillMul=0.60; eff.moodDelta=-2; eff.energyDelta=-3;
    eff.note=`\n\n（${w.icon} 雨下个不停，操场上几乎没人，地面又湿又滑。）`;
  }else if(w.id==='snow'){
    eff.skillMul=0.50; eff.moodDelta=-3; eff.energyDelta=-5;
    eff.note=`\n\n（${w.icon} 雪地里活动，手脚都不太听使唤。）`;
  }else if(w.id==='wind'){
    eff.skillMul=0.75; eff.moodDelta=-1;
    eff.note=`\n\n（${w.icon} 风很大，吹得人睁不开眼，跑起来灌了一嘴凉气。）`;
  }
  return eff;
}

/* 触发节日活动 */
function triggerFestivalEvent(cb){
  const fest=getFestival();
  if(!fest){if(cb)cb();return;}
  const ev=FESTIVAL_EVENTS[fest.id];
  if(!ev){if(cb)cb();return;}

  /* 判断玩家当前年级：1=大一，2=大二，3=大三，4=大四 */
  const grade=Math.ceil(S.semester/2);
  let yearKey='y'+Math.min(Math.max(grade,1),4);

  /* ===== 前置条件检查：玩家状态不满足高年级剧情假设时，降级到 y1 =====
     例：大三的 520 剧情假设玩家有恋人；大二的中秋剧情假设玩家有社团；
         大二的圣诞剧情假设玩家有 ≥2 个亲密朋友。若不满足则走 y1。 */
  const hasClub = S.player.clubs.length > 0;
  const hasLover = S.npcs.some(n=>n.love>0);
  const closeFriends = S.npcs.filter(n=>n.known && n.aff>=50).length;
  const downgrade = (
    (fest.id==='midautumn'  && yearKey==='y2' && !hasClub) ||
    (fest.id==='love520'    && (yearKey==='y3' || yearKey==='y4') && !hasLover) ||
    (fest.id==='christmas'  && yearKey==='y2' && closeFriends < 2) ||
    (fest.id==='christmas'  && yearKey==='y3' && !hasLover) ||
    (fest.id==='christmas'  && yearKey==='y4' && !hasLover && closeFriends < 1)
  );
  if(downgrade) yearKey='y1';

let yearEv=ev[yearKey];

/* ===== 女生节：男生走 male 专属文案 =====
   女生节默认文案是写给女生的（领花、收到花、被约吃饭等），
   男生玩家应走 male 分支（帮挂横幅、写贺卡、送花等）。
   其它节日不受影响。 */
if(fest.id==='girlsday' && S.player.gender==='男' && yearEv && yearEv.male){
  yearEv = yearEv.male;
}

/* 兼容旧格式（如果没有 y1~y4，则用原来的 title/body/choices） */
if(!yearEv){
  if(cb)cb();return;
}

  /* 每个节日每学期只触发一次 */
  const key='fest_'+fest.id+'_'+S.semester;
  if(S[key]){if(cb)cb();return;}
  S[key]=true;

  showChoice(yearEv.title,yearEv.body,yearEv.choices,(v)=>{
    yearEv.onChoose(v);
    if(cb)cb();
  });
}
function getFestival(){
  const isFall=(S.semester%2===1);
  const month=(isFall?9:3)+Math.ceil(S.week/4)-1;
  const wk=((S.week-1)%4)+1;
  const season=isFall?'fall':'spring';
  return FESTIVALS.find(f=>f.month===month && f.wk===wk && f.season===season)||null;
}/* ===== 生日系统 ===== */
/* 生日有两种：
   - type:'term'     学期内生日（9-12月 / 3-6月），按 season + week 存
   - type:'vacation' 假期生日（寒假 1-2月 / 暑假 7-8月），按 month + mw 存
   玩家/NPC 约 45% 概率拿到假期生日，55% 概率学期内生日 */
function genBirthday(){
  if(Math.random() < 0.45){
    const isWinter = Math.random() < 0.5;
    const month = isWinter ? pick([1,2]) : pick([7,8]);
    return {
      type: 'vacation',
      month: month,
      mw: rnd(1,4)
    };
  }
  return {
    type: 'term',
    season: Math.random()<0.5?'fall':'spring',
    week: rnd(2,15)
  };
}

/* 学期内生日：只在对应 season+week 触发
   假期生日：返回 false（由假期专用函数处理） */
function isNpcBirthday(npc){
  if(!npc.birthday)return false;
  const b = npc.birthday;
  if(b.type === 'vacation')return false;
  const season=(S.semester%2===1)?'fall':'spring';
  return season===b.season && S.week===b.week;
}

function isPlayerBirthday(){
  const b=S.playerBirthday;
  if(!b)return false;
  if(b.type === 'vacation')return false;
  const season=(S.semester%2===1)?'fall':'spring';
  return season===b.season && S.week===b.week;
}

function getBirthdayNpcs(){
  return S.npcs.filter(n=>n.known && isNpcBirthday(n));
}

/* ===== 假期生日判定（新增）===== */
/* 当前假期类型：winter 或 summer */
function currentVacationType(){
  const sem = S._vacationSemester;
  if(!sem) return null;
  return (sem % 2 === 1) ? 'winter' : 'summer';
}

/* 检查一个 birthday 对象是否符合当前假期 */
function isVacationBirthdayMatch(b){
  if(!b || b.type !== 'vacation') return false;
  const vacType = currentVacationType();
  if(!vacType) return false;
  const isWinterMonth = (b.month === 1 || b.month === 2);
  const isSummerMonth = (b.month === 7 || b.month === 8);
  if(vacType === 'winter' && isWinterMonth) return true;
  if(vacType === 'summer' && isSummerMonth) return true;
  return false;
}

/* 假期里正在过生日的已认识 NPC */
function getVacationBirthdayNpcs(){
  return S.npcs.filter(n=>n.known && isVacationBirthdayMatch(n.birthday));
}

/* 假期里是否是玩家生日 */
function isPlayerVacationBirthday(){
  return isVacationBirthdayMatch(S.playerBirthday);

function assignNpcStory(npc){
  /* 老师 / 辅导员：不分配故事线 */
  if(npc.role==='老师' || npc.role==='辅导员'){
    npc.storyId=null;
    npc.storyStage=0;
    return;
  }

  /* 只从明确符合该身份 / 社团的故事里挑 */
  const eligible=NPC_STORIES.filter(s=>{
  if(!s.forRoles.includes(npc.role))return false;
  if(s.forClub&&!s.forClub.includes(npc.club))return false;
  // 👇 新增这一行：如果这条故事线绑定社团，且玩家没加这个社团，直接不分配！
  if(s.forClub && !S.player.clubs.includes(npc.club)) return false; 
  return true;
});

  /* 没有符合的故事线 → 不给故事（不再从其它身份里硬拉） */
  if(!eligible.length){
    npc.storyId=null;
    npc.storyStage=0;
    return;
  }

  /* 并非每个 NPC 都有故事线：约 55% 概率分配 */
  if(Math.random() > 0.55){
    npc.storyId=null;
    npc.storyStage=0;
    return;
  }

  const story=pick(eligible);
  npc.storyId=story.id;
  npc.storyStage=0;
}

function getNpcStory(npc){
  if(!npc.storyId)return null;
  return NPC_STORIES.filter(Boolean).find(s=>s.id===npc.storyId)||null;
}

function getNpcStoryStage(npc){
  const s=getNpcStory(npc);
  if(!s)return null;
  const idx=npc.storyStage||0;
  if(idx>=s.stages.length)return null;
  return {story:s, stage:s.stages[idx], index:idx, total:s.stages.length};
}

function canTriggerNpcStory(npc){
  const info=getNpcStoryStage(npc);
  if(!info)return false;
  if(npc.aff < info.stage.need) return false;
  /* 新增：若该阶段标注了最低学期门槛，未到大四毕业季不触发 */
  if(info.stage.minSem && S.semester < info.stage.minSem) return false;
  return true;
}

function triggerNpcStory(npc){
  const info=getNpcStoryStage(npc);
  if(!info)return;
  if(S.ap<info.stage.ap){
    showModal('⏰ 行动点不足',`需要 ${info.stage.ap} 点行动点。`,[]);
    return;
  }
  S.ap-=info.stage.ap;

  const pron=getPronoun(npc);
  const before=snapshot();
  const affBefore=npc.aff;

  const text=info.stage.text
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub);
  const ok=info.stage.ok
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub);

  npc.aff=clamp(npc.aff+info.stage.aff,0,100);
  const realAff=npc.aff-affBefore;

  /* 阶段完成 */
  npc.storyStage=(npc.storyStage||0)+1;

  /* 特殊奖励 */
  if(info.stage.bonus){
    if(info.stage.bonus.skill)addSkill(info.stage.bonus.skill,info.stage.bonus.v);
    if(info.stage.bonus.base)addBase(info.stage.bonus.base,info.stage.bonus.v);
  }

  const isLast=npc.storyStage>=info.story.stages.length;
  const titleLine=`${info.story.title} · ${info.index+1}/${info.total}`;
  const body=`${text}\n\n${ok}`;

  addEvent(`📖 ${npc.name} 的故事：${info.story.title}（${info.index+1}/${info.total}）`,'npc');

  const after=snapshot();
  const changes=diffStats(before,after);
  changes.push({label:`${npc.name} 好感 +${realAff}`,dir:'up'});
  if(info.stage.bonus){
    if(info.stage.bonus.skill)changes.push({label:`${info.stage.bonus.skill} +${info.stage.bonus.v}`,dir:'up'});
    if(info.stage.bonus.base)changes.push({label:`${info.stage.bonus.base} +${info.stage.bonus.v}`,dir:'up'});
  }
  if(isLast)changes.push({label:'🎉 故事完结',dir:'love'});

  S._scene={title:titleLine,body,changes,onOk:null,styleClass:''};
  S.phase='scene';
  render();
}/* ===== 专业课排课系统 ===== */

function generateWeekCourses(){
  const m=S.player.major;
  /* 从对应专业的课程池里随机抽一门 */
  const pool=MAJOR_COURSES[m.n] || [m.n+'专业课'];
  const name=pick(pool);
  /* 从所有老师里随机一位 */
  const teachers=S.npcs.filter(n=>n.role==='老师');
  const teacher=teachers.length?pick(teachers):null;
  /* 随机一天 */
  const day=pick(WEEK_DAYS);
  S.weekCourses=[{
    id:'c0',
    day:day,
    name:name,
    loc:m.loc,
    teacher:teacher,
    attended:false,
    skipped:false
  }];
}

function weekCoursesDone(){
  if(!S.weekCourses)return true;
  return S.weekCourses.every(c=>c.attended||c.skipped);
}

function weekCoursesAllAttended(){
  if(!S.weekCourses||!S.weekCourses.length)return false;
  return S.weekCourses.every(c=>c.attended);
}

function attendCourse(courseId){
  const c=(S.weekCourses||[]).find(x=>x.id===courseId);
  if(!c||c.attended||c.skipped)return;
  if(S.ap<=0){showModal('⏰ 行动点用完了','本周的行动点已经用完。',[]);return;}
  const before=snapshot();
  S.ap--;
  const m=mult();
  const p=S.player;
  addSkill(p.major.s1,Math.round(3*m));
  addSkill(p.major.s2,Math.round(2*m));
  addProg(Math.round(8*m));
  S.energy=clamp(S.energy-12,0,100);
  c.attended=true;

  /* ===== 上课后随机布置作业（当前没有未完成作业时才有机会触发）===== */
  let homeworkLine='';
  const canHaveHomework = !S.homework || S.homework.done;
  if(canHaveHomework && Math.random() < 0.55){
    generateHomework();
    homeworkLine=`\n\n📝 下课前，老师布置了一份作业：\n\n【${S.homework.type}】${S.homework.desc}\n\n（去「教学楼 - 写作业」完成）`;
    addEvent(`📝 《${c.name}》课后布置了作业「${S.homework.type}」。`,'sys');
  }

  const teacherLine=c.teacher?`\n\n${c.teacher.name} 在讲台上看了你一眼，点了点头。`:'';
  let body=`${c.day}，你去上了《${c.name}》。${teacherLine}\n\n老师讲得很细，你笔记记了满满一页。${homeworkLine}`;
  addEvent(`📖 ${c.day}专业课：你认真去上了《${c.name}》。`,'good');

  const after=snapshot();
  const changes=diffStats(before,after);
  gotoScene(`📖 ${c.day} · ${c.name}`,body,changes);
}

function skipCourse(courseId){
  const c=(S.weekCourses||[]).find(x=>x.id===courseId);
  if(!c||c.attended||c.skipped)return;
  c.skipped=true;

  S.homeworkScore=clamp((S.homeworkScore||60)-5,0,100);
  S.mood=clamp(S.mood-3,0,100);
  const body=`${c.day}的《${c.name}》你请了假。\n\n你给老师发了消息说明情况。\n\n虽然没去上课，但该补的内容还是得自己补上。`;
  addEvent(`😐 ${c.day}请假，平时分 -5。`,'act');
  const changes=[
    {label:'平时分 -5',dir:'down'},
    {label:'心情 -3',dir:'down'}
  ];

  showModal(`😐 ${c.day} · 请假`,body,changes,()=>render());
}/* ===== 作业 / 平时分系统 ===== */

function generateHomework(){
  const t=pick(HOMEWORK_TYPES);
  S.homework={
    type:t.n,
    desc:t.d,
    baseProg:t.prog,
    dueWeek:S.week,
    dueSem:S.semester,
    done:false,
    quality:null
  };
}

function homeworkScoreLabel(){
  const s=S.homeworkScore||0;
  if(s>=85)return '优秀';
  if(s>=70)return '良好';
  if(s>=55)return '中规中矩';
  if(s>=40)return '偏低';
  return '危险';
}

function homeworkScoreColor(){
  const s=S.homeworkScore||0;
  if(s>=70)return '#3aa886';
  if(s>=55)return '#d97706';
  if(s>=40)return '#ea580c';
  return '#dc2626';
}/* ===== 假期系统 ===== */

/* ===== 意外事件触发 ===== */
function tryUnexpectedEvent(){
  const usedThisWeek=(S._unexpectedThisWeek||[]);
  const available=UNEXPECTED_EVENTS.filter(e=>!usedThisWeek.includes(e.id));
  if(!available.length)return null;
  return pick(available);
}

function showUnexpectedEvent(ev){
  if(!ev)return;
  const r=ev.roll();
  if(!r)return;
  S._unexpectedThisWeek=S._unexpectedThisWeek||[];
  S._unexpectedThisWeek.push(ev.id);

  if(r.choices && r.onChoose){
    /* 带分支的弹窗 */
    showChoice(
      r.title,
      r.body,
      r.choices,
      (v)=>{
        const result=r.onChoose(v);
        if(result){
          setTimeout(()=>{
            showModal(result.title,result.body,result.changes||[],()=>{
              if(r.onOk)r.onOk();
              render();
            });
          },200);
        }
      }
    );
  }else{
    /* 无分支的弹窗 */
    showModal(r.title,r.body,r.changes||[],()=>{
      if(r.onOk)r.onOk();
      render();
    });
  }
}

/* ===== 专业事件触发 ===== */
function tryMajorEvent(){
  if(!S.player || !S.player.major)return null;
  const pool=MAJOR_EVENTS[S.player.major.n];
  if(!pool || !pool.length)return null;
  /* 本周已经触发过的不再重复 */
  const usedThisWeek=(S._majorEventThisWeek||[]);
  const available=pool.filter(e=>!usedThisWeek.includes(e.id));
  if(!available.length)return null;
  return pick(available);
}

function applyMajorEvent(ev){
  if(!ev)return;
  /* 奖励 */
  if(ev.reward){
    const r=ev.reward;
    if(r.skill)addSkill(r.skill, r.v||1);
    if(r.base)addBase(r.base, r.v||1);
    if(r.skill2){
      /* 第二个技能/属性用同 v 值 */
      const skillKeys=['学术','艺术','体育','社交','实践'];
      if(skillKeys.includes(r.skill2))addSkill(r.skill2, r.v||1);
      else addBase(r.skill2, r.v||1);
    }
    if(r.base2)addBase(r.base2, r.v||1);
  }
  if(ev.mood)  S.mood=clamp(S.mood+(ev.mood||0),0,100);
  if(ev.energy)S.energy=clamp(S.energy+(ev.energy||0),0,100);
  if(ev.money) addMoney(ev.money);
  addEvent(ev.eventText||ev.title, (ev.mood&&ev.mood<0)?'bad':'good');
}

function showMajorEvent(ev){
  if(!ev)return;
  const before=snapshot();
  applyMajorEvent(ev);
  /* 记录本周已触发 */
  S._majorEventThisWeek=S._majorEventThisWeek||[];
  S._majorEventThisWeek.push(ev.id);
  const after=snapshot();
  const changes=diffStats(before,after);
  gotoScene(`✨ ${ev.title}`, ev.body, changes);
}

function getSignupableEvent(){
  // 本周是报名周 → 可以报名
  return CAMPUS_EVENTS.filter(e=>e.signWeek===S.week);
}

function getActiveEvent(){
  if(!S.activeCampusEvent)return null;
  return CAMPUS_EVENTS.find(e=>e.id===S.activeCampusEvent.id);
}

function openEventSignup(eventId, cb){
  const ev=CAMPUS_EVENTS.find(e=>e.id===eventId);
  if(!ev){ if(cb)cb(); return; }
  
  if(S.activeCampusEvent){
    showModal('🎪 已经报过名','你本学期已经报名参加了活动。',[], ()=>{ if(cb)cb(); });
    return;
  }
  if(S._campusEventDone && S._campusEventDone.includes(ev.id)){
    showModal('🎪 已参加过',`你本学期已经参加过${ev.name}了。`, [], ()=>{ if(cb)cb(); });
    return;
  }
  
  showChoice(
    `🎪 报名 · ${ev.name}`,
    `📢 ${ev.desc}\n\n`+
    `📍 准备地点：${ev.prep}\n`+
    `⭐ 关键技能：${ev.skill}（当前 ${S.player.skills[ev.skill]||0}）\n`+
    `📅 决赛周：第 ${ev.finalWeek} 周\n\n`+
    `报名后可在准备地点进行「活动准备」积累准备值。`,
    [
      {label:'报名',value:'yes'},
      {label:'算了',value:'no',cls:'ghost'}
    ],
    (v)=>{
      if(v==='yes'){
        S.activeCampusEvent={
          id:ev.id, name:ev.name, prep:ev.prep, skill:ev.skill, base:ev.base,
          prepValue:0, startSem:S.semester, startWeek:S.week, finalWeek:ev.finalWeek, notifyWeek:S.week
        };
        addEvent(`🎪 你报名参加了「${ev.name}」。准备地点：${ev.prep}。`,'club');
        showModal(`🎪 报名成功 · ${ev.name}`,
          `你报名参加了${ev.name}。\n\n📍 准备地点：${ev.prep}\n📅 决赛：第 ${ev.finalWeek} 周\n\n去准备地点进行「活动准备」，积累越多，决赛表现越好。`,
          [], ()=>{ render(); if(cb)cb(); });
      }else{
        addEvent(`🎪 你放弃了「${ev.name}」的报名。`,'sys');
        render();
        if(cb)cb();
      }
    }
  );
}

function vacationLabel(sem){
  // sem 是刚结束的学期，假期属于这个学期末
  const isWinter=sem%2===1;
  return isWinter?'寒假':'暑假';
}/* ===== 考试周系统 ===== */
const EXAM_WEEKS=[7,8,15,16];

function isExamWeek(){
  return EXAM_WEEKS.includes(S.week);
}

function isPreExamWeek(){
  return S.week===7||S.week===15;
}

function examProgressNeed(){
  return S.week<=8?50:100;
}

function examStressLevel(){
  const need=examProgressNeed();
  const prog=S.studyProgress;
  if(prog>=need*1.2)return 0;
  if(prog>=need)return 1;
  if(prog>=need*0.6)return 2;
  return 3;
}

function examWeekMoodDelta(){
  const lvl=examStressLevel();
  if(lvl===0)return +2;
  if(lvl===1)return 0;
  if(lvl===2)return -6;
  return -12;
}

function examWeekNote(){
  if(!isExamWeek())return '';
  const lvl=examStressLevel();
  const w=pick(EXAM_WEEK_SCENES);
  if(lvl===0)return `\n\n📝 考试周\n${w}\n\n（你的复习进度还不错，心态比较稳。）`;
  if(lvl===1)return `\n\n📝 考试周\n${w}\n\n（进度刚好够，但心里还是有点虚。）`;
  if(lvl===2)return `\n\n📝 考试周\n${w}\n\n（复习进度不太够，心里有点发慌。）`;
  return `\n\n📝 考试周\n${w}\n\n（几乎没怎么复习，你开始有点后悔了。）`;

  if(!S.messages)S.messages=[];
  const tpl=pick(MSG_TEMPLATES);
  S.messages.unshift({
    id:'m'+Date.now()+Math.floor(Math.random()*1000),
    npcId:npc.id,

  });

}

/* 生日换算：统一转成 {month, mw, inVacation}
   学期内：week 1-4=9月，5-8=10月，9-12=11月，13-16=12月（春季同理推 3-6 月）
   假期：直接是 {month, mw} */
function birthdayToMonthWeek(b){
  if(!b)return null;
  if(b.type === 'vacation'){
    return {month:b.month, mw:b.mw, inVacation:true};
  }
  const monthBase=b.season==='fall'?9:3;
  const month=monthBase+Math.floor((b.week-1)/4);
  const mw=((b.week-1)%4)+1;
  return {month, mw, inVacation:false};
}

function birthdayText(b){
  const mw=birthdayToMonthWeek(b);
  if(!mw)return '未设置';
  const suffix = mw.inVacation ? '（假期）' : '';
  return `${mw.month}月第${mw.mw}周${suffix}`;
}

/* 设置玩家生日
   month 1-12，mw 1-4
   1、2 月 → 寒假；7、8 月 → 暑假；其他月份 → 学期内 */
function setPlayerBirthday(month,mw){
  if(month === 1 || month === 2 || month === 7 || month === 8){
    S.playerBirthday = {
      type: 'vacation',
      month: month,
      mw: mw
    };
    return;
  }
  const season=month>=9?'fall':'spring';
  const monthBase=season==='fall'?9:3;
  const week=(month-monthBase)*4+mw;
  S.playerBirthday={type:'term', season, week};
}

function giftBaseAff(price){
  if(price<80)return 5;
  if(price<250)return 12;
  return 22;
}

function giftMatchCount(gift,npc){
  if(!npc.hobbies||!npc.hobbies.length)return 0;
  let c=0;
  gift.tags.forEach(t=>{
    if(npc.hobbies.includes(t))c++;
  });
  return c;
}function calcGiftEffect(gift,npc){
  const base=giftBaseAff(gift.price);
  const match=giftMatchCount(gift,npc);
  /* 学期内生日 或 假期生日 都算"生日"，翻倍 */
  const isBday = isNpcBirthday(npc) ||
    (S.phase === 'vacation' && isVacationBirthdayMatch(npc.birthday));
  const fest=getFestival();

  let aff=base;
  let mood=2;
  let label='';
  let bad=false;

  if(match>=2){
    aff=Math.round(base*1.8);
    mood+=4;
    label='超对胃口';
  }else if(match===1){
    aff=Math.round(base*1.4);
    mood+=2;
    label='对方喜欢';
  }else{
    if(['腹黑','毒舌','高冷','闷骚'].includes(npc.person)){
      aff=Math.round(base*0.3);
      mood-=2;
      bad=true;
      label='似乎不太喜欢';
    }else if(['温柔','热心','开朗','元气'].includes(npc.person)){
      aff=base;
      label='礼貌收下';
    }else{
      aff=Math.round(base*0.7);
      label='反应平淡';
    }
  }

  if(isBday){
    aff=Math.round(aff*2);
    mood+=5;
    label+=' · 生日翻倍';
  }

  if(fest&&!isBday){
    aff=Math.round(aff*1.3);
    label+=' · '+fest.name;
  }

  return {aff,mood,label,bad,match,isBday};
}

function clothId(style,gender,idx){return style+'|'+gender+'|'+idx;}
function getClothById(id){
  if(!id)return null;
  const p=String(id).split('|');
  if(p.length!==3)return null;
  const style=p[0],gender=p[1],idx=Number(p[2]);
  const arr=WARDROBE[style]&&WARDROBE[style][gender];
  if(!arr||!arr[idx])return null;
  const [name,price]=arr[idx];
  return {id,style,gender,idx,name,price};
}
function calcClothBonus(price){
  if(price>=400)return 3;
  if(price>=200)return 2;
  return 1;
}

function doBuyCloth(id){
  const c=getClothById(id);
  if(!c)return false;
  if(S.wardrobe.includes(id))return false;
  if((S.money||0)<c.price)return false;
  addMoney(-c.price);
  S.wardrobe.push(id);
  addEvent(`👕 你买了一件「${c.name}」（-${c.price}元）。`,'money');
  return true;
}

function doUnequipClothSilent(){
  if(!S.equipped)return;
  if(S.equipBonus){
    for(const k in S.equipBonus){
      S.player.base[k]=clamp(S.player.base[k]-S.equipBonus[k],0,100);
    }
  }
  S.equipped=null;
  S.equipBonus={};
}

function doEquipCloth(id){
  if(!S.wardrobe.includes(id))return false;
  const c=getClothById(id);
  if(!c)return false;
  doUnequipClothSilent();
  const stat=STYLE_STAT[c.style];
  const v=calcClothBonus(c.price);
  S.player.base[stat]=clamp(S.player.base[stat]+v,0,100);
  S.equipped=id;
  S.equipBonus={[stat]:v};
  S.player.style=c.style;
  addEvent(`👕 你换上了「${c.name}」（${stat} +${v}）。`,'good');
  return true;
}

function doUnequipCloth(){
  if(!S.equipped)return;
  doUnequipClothSilent();
  S.player.style='休闲';
  addEvent('👕 你脱下了装备。','sys');
}

function openWardrobe(){
  const old=document.querySelector('.modal-wrap');
  if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.className='modal-wrap';

  const pg = S.player.gender==='女' ? '女' : '男';
  const genders = [pg, '中性'];
  const styles = ['全部','休闲','文艺','运动','正式','甜美','街头','极简','复古'];
  let curStyle='全部';

  function renderEquipped(){
    if(!S.equipped)return `<div class="mini" style="color:#8ba7bb">当前未穿戴任何装备</div>`;
    const c=getClothById(S.equipped);
    if(!c)return '';
    const bonus=S.equipBonus?Object.keys(S.equipBonus).map(k=>`${k} +${S.equipBonus[k]}`).join(' · '):'';
    return `<div class="mini"><b>${escapeHtml(c.name)}</b> · ${escapeHtml(c.style)} · <span style="color:#3aa886">${bonus}</span></div>`;
  }

  function renderList(){
    const list=[];
    styles.slice(1).forEach(st=>{
      if(curStyle!=='全部' && curStyle!==st)return;
      genders.forEach(g=>{
        (WARDROBE[st]&&WARDROBE[st][g]||[]).forEach((item,idx)=>{
          list.push({id:clothId(st,g,idx),style:st,gender:g,idx,name:item[0],price:item[1]});
        });
      });
    });
    if(!list.length){
      return `<div class="mini" style="text-align:center;padding:20px 0;color:#8ba7bb">这一类还没有衣服。</div>`;
    }
    return list.map(c=>{
      const owned=S.wardrobe.includes(c.id);
      const equipped=S.equipped===c.id;
      const stat=STYLE_STAT[c.style];
      const v=calcClothBonus(c.price);
      const canBuy=(S.money||0)>=c.price;
      let actionHTML='';
      if(equipped){
        actionHTML=`<button class="btn ghost sm" data-wardrobe="unequip" data-id="${c.id}">脱下</button>`;
      }else if(owned){
        actionHTML=`<button class="btn sm" data-wardrobe="equip" data-id="${c.id}">装备</button>`;
      }else{
        actionHTML=`<button class="btn ${canBuy?'gold':'ghost'} sm" data-wardrobe="buy" data-id="${c.id}" ${canBuy?'':'disabled'}>💰${c.price}</button>`;
      }
      return `<div class="npc" style="cursor:default">
        <div class="av" style="background:${equipped?'#3aa886':'#fbbf24'};font-size:16px">👕</div>
        <div style="flex:1">
          <div class="npc-n">${escapeHtml(c.name)}${equipped?' <span style="color:#3aa886;font-size:11px">· 使用中</span>':''}</div>
          <div class="npc-d">${escapeHtml(c.style)} · ${c.gender} · <span style="color:#4b8db8">${stat} +${v}</span></div>
        </div>
        <div style="flex:0 0 auto">${actionHTML}</div>
      </div>`;
    }).join('');
  }

  function refresh(){
    wrap.querySelector('.modal-body').innerHTML=renderList();
    wrap.querySelector('.equip-line').innerHTML=renderEquipped();
    wrap.querySelector('.money-line').textContent=`当前金钱：💰 ${S.money||0}`;
    wrap.querySelectorAll('[data-wardrobe]').forEach(b=>{
      b.onclick=()=>{
        const act=b.dataset.wardrobe;
        const id=b.dataset.id;
        if(act==='buy')doBuyCloth(id);
        else if(act==='equip')doEquipCloth(id);
        else if(act==='unequip')doUnequipCloth();
        refresh();
      };
    });
  }

  wrap.innerHTML=`
  <div class="modal-box">
    <div class="modal-title" style="flex:0 0 auto">👕 衣柜</div>
    <div class="equip-line" style="margin-bottom:4px;flex:0 0 auto"></div>
    <div class="mini money-line" style="text-align:center;margin-bottom:8px;color:#b45309;flex:0 0 auto"></div>
    <div class="modal-body"></div>
    <div style="flex:0 0 auto;padding-top:8px;border-top:1px solid #eef5f9">
      <div style="display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none">
        ${styles.map(s=>`<button class="chip ${s===curStyle?'on':''}" data-style="${s}" style="flex:0 0 auto;padding:4px 10px;font-size:12px;border-radius:14px;white-space:nowrap">${s}</button>`).join('')}
      </div>
      <button class="btn ghost" style="width:100%" id="closeWardrobe">关闭</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);

  wrap.querySelectorAll('[data-style]').forEach(b=>{
    b.onclick=()=>{
      curStyle=b.dataset.style;
      wrap.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('on',x.dataset.style===curStyle));
      refresh();
    };
  });
  wrap.querySelector('#closeWardrobe').onclick=()=>{wrap.remove();render();};

  refresh();
}

function pickBroadcastCategory(){
  const weights={};
  const w=getWeather();
  const fest=getFestival();

  weights.weather = 3;
  weights.news = 3;
  weights.gossip = 2;
  weights.teacher = 1;
  weights.canteen = 2;
  weights.study = isExamWeek()?4:2;
  weights.love = S.npcs.some(n=>n.love>0)?3:1;
  weights.silly = 2;

  if(fest)weights.news += 2;

  const arr=[];
  Object.keys(weights).forEach(k=>{
    for(let i=0;i<weights[k];i++)arr.push(k);
  });
  return pick(arr);
}
/* ===== 广播内容时间校验：不符合当前时间的广播不出现 ===== */
function broadcastPoolOK(text){
  if(typeof text !== 'string') return true;
  const isFall = (S.semester % 2 === 1);
  const isSpring = !isFall;

  // 1. 期末相关 (第 13-16 周)
  if(text.includes('期末临近') || text.includes('期末成绩') || text.includes('期末考试安排')){
    // 期末成绩录入需要考完试，至少要在 15 周及以后
    if(text.includes('成绩录入')) return S.week >= 15;
    return S.week >= 13;
  }
  // 2. 期中相关 (第 9-14 周)
  if(text.includes('期中成绩')){
    return S.week >= 9 && S.week <= 14;
  }
  // 3. 开学初专属 (第 1-6 周)：招新、助学金、试营业
  if(text.includes('社团招新') || text.includes('助学金申请') || text.includes('试营业')){
    return S.week <= 6;
  }
  // 4. 选课系统 (第 14 周以后)
  if(text.includes('选课系统')){
    return S.week >= 14;
  }
  // 5. 毕业/招聘 (大三/大四 学期，即 semester >= 5)
  if(text.includes('招聘会') || text.includes('简历修改')){
    return S.semester >= 5;
  }
  // 6. 换季流感 (秋季9-11月 或 春季3-4月)
  if(text.includes('换季流感')){
    return (isFall && S.week <= 12) || (isSpring && S.week <= 8);
  }
  // 7. 春季专属文案防穿越
  if(text.includes('春季学期')){
    return isSpring;
  }
  // 8. 校园歌手大赛 (报名到决赛期间：第4-11周)
  if(text.includes('校园歌手大赛')){
    return S.week >= 4 && S.week <= 11;
  }
  // 9. 考试周吐槽 (第7、8、15、16周)
  if(text.includes('这次考试不难')){
    return isExamWeek();
  }
  // 10. 校运会 (第5-11周)
  if(text.includes('校运会可能提前')){
    return S.week >= 5 && S.week <= 11;
  }
  // 11. 雨天专属
  if(text.includes('雨中撑一把伞')){
    const w = getWeather();
    return w && w.id === 'rain';
  }
  // 12. 交换生 (开学前8周)
  if(text.includes('交换生')){
    return S.week <= 8;
  }

  return true;
}

function getBroadcastText(){
  const cat=pickBroadcastCategory();

  /* 按当前时间过滤掉不符合的广播 */
  let pool=(BROADCAST_POOL[cat]||BROADCAST_POOL.silly).filter(broadcastPoolOK);
  if(!pool.length) pool=BROADCAST_POOL.silly.filter(broadcastPoolOK);
  if(!pool.length) pool=BROADCAST_POOL.silly;

  const w=getWeather();
  const city=S.school||'校园';

  const placePool=['操场','江边','图书馆','教学楼','食堂','宿舍楼下','活动中心','小树林','天台'];
  const dormPool=['男寝','女寝'];

  let text=pick(pool);
  text=text
    .replace(/\{weather\}/g,w?w.n:'晴')
    .replace(/\{desc\}/g,w?w.desc:'')
    .replace(/\{month\}/g,String(currentMonth()))
    .replace(/\{city\}/g,city)
    .replace(/\{place\}/g,pick(placePool))
    .replace(/\{dorm\}/g,pick(dormPool));

  /* 玩家相关追加 */
  if(S.sick>0 && Math.random()<0.6){
    text=`广播站温馨提示：最近流感高发，注意休息。——（你还在生病中）`;
  }else if(S.mood<=25 && Math.random()<0.5){
    text=`广播站今日点歌：一首轻音乐，送给心情不太好的同学。`;
  }else if(S.mood>=85 && Math.random()<0.4){
    text=`今日校园气氛不错，广播站也感觉轻快了起来。`;
  }

/* ===== 广播滚动控制（不被重新渲染打断） ===== */
let _bcOffset=0;
let _bcWidth=0;
let _bcWrapW=200;
let _bcLastTime=0;
let _bcRAF=null;
let _bcLastText='';

function initBroadcastScroll(){
  // 先销毁旧动画，防止rAF内存泄露
  if(_bcRAF) {
    cancelAnimationFrame(_bcRAF);
    _bcRAF = null;
  }
  const el = document.querySelector('.broadcast-text');
  // DOM不存在直接退出，不抛出异常
  if(!el || !el.parentElement){
    _bcRAF = null;
    return;
  }
  _bcWidth = el.offsetWidth || 100;
  _bcWrapW = el.parentElement.offsetWidth || 200;
  const curText = el.textContent || "";
  if(curText !== _bcLastText){
    _bcLastText = curText;
    _bcOffset = _bcWrapW;
  }
  _bcLastTime = 0;
  const tick = (time)=>{
    const e = document.querySelector('.broadcast-text');
    // DOM丢失立刻终止动画循环
    if(!e || !e.parentElement){
      _bcRAF = null;
      return;
    }
    if(!_bcLastTime) _bcLastTime = time;
    const dt = Math.min(time - _bcLastTime, 64);
    _bcLastTime = time;
    _bcOffset -= dt * 0.035;
    if(_bcOffset < -_bcWidth - 10){
      _bcOffset = _bcWrapW;
    }
    e.style.transform = `translateX(${_bcOffset}px)`;
    _bcRAF = requestAnimationFrame(tick);
  };
  _bcRAF = requestAnimationFrame(tick);
}

function refreshBroadcast(){
  if(!S._broadcastText){
    S._broadcastText=getBroadcastText();
  }
}

function triggerDormEvent(cb){
  const roommates=S.npcs.filter(n=>n.role==='舍友' && n.known);
  if(!roommates.length){if(cb)cb();return;}

  /* 每周最多触发一次 */
  const absKey=S.semester*16+S.week;
  if(S._dormEventWeek===absKey){if(cb)cb();return;}

  /* 25% 概率触发 */
  if(Math.random()>0.25){if(cb)cb();return;}
  S._dormEventWeek=absKey;

  const ev=pick(DORM_EVENTS);
  const r=ev.roll(roommates);
  if(!r){if(cb)cb();return;}

  if(r.choices && r.onChoose){
    showChoice(r.title, r.body, r.choices, (v)=>{
      const res=r.onChoose(v);
      if(res){
        setTimeout(()=>{ showModal(res.title, res.body, res.changes||[], ()=>{if(cb)cb();}); }, 200);
      }else{
        if(cb)cb();
      }
    });
  }else{
    showModal(r.title, r.body, r.changes||[], ()=>{
      if(r.onOk)r.onOk();
      if(cb)cb();
    });
  }
}

function triggerLoveEvent(cb){
  const lovers=S.npcs.filter(n=>n.love>0);
  if(!lovers.length){if(cb)cb();return;}

  /* 每周最多触发一次 */
const absKey=S.semester*16+S.week;
if(S._loveEventWeek===absKey){if(cb)cb();return;}

// 👇 根据当前恋人的爱情值决定主动概率
const maxLove = Math.max(...lovers.map(l=>l.love));
let triggerRate = 0.4; // 基础 40%
if (maxLove >= 80) triggerRate = 0.6; // 热恋期 60% 概率主动找你

if(Math.random() > triggerRate){if(cb)cb();return;}
S._loveEventWeek=absKey;

  const npc=pick(lovers);

// 👇 新增：读取冷却池，如果没有就初始化
if(!S._recentLoveEvents) S._recentLoveEvents = [];

// 👇 过滤：排除近期触发过的事件
let available = LOVE_EVENTS.filter(e => !S._recentLoveEvents.includes(e.id));

// 如果所有事件都进冷却了，清空冷却池重来
if(available.length === 0){
  S._recentLoveEvents = [];
  available = LOVE_EVENTS;
}

// 在可用的事件中，再筛选符合触发条件的
const eligible = available.filter(e=>{
  try { return e.roll(npc) !== null; } catch(err) { return false; }
});

if(!eligible.length){if(cb)cb();return;}

const ev=pick(eligible);

// 👇 选中后，把事件加入冷却池，最多记住最近 6 个事件
S._recentLoveEvents.push(ev.id);
if(S._recentLoveEvents.length > 6){
  S._recentLoveEvents.shift();
}

// 重新获取一次事件结果
const r=ev.roll(npc);
if(!r){if(cb)cb();return;}

  if(r.choices && r.onChoose){
    showChoice(r.title, r.body, r.choices, (v)=>{
      const res=r.onChoose(v);
      if(res && res.title){
        setTimeout(()=>{
          showModal(res.title, res.body, res.changes||[], ()=>{if(cb)cb();});
        }, 200);
      }else{
        if(cb)cb();
      }
    });
  }else{
    showModal(r.title, r.body, r.changes||[], ()=>{
      if(r.onOk)r.onOk();
      if(cb)cb();
    });
  }
}

/* 竞选时机：每学期初（第1周），玩家大二/大三时，且是社团成员 */
function shouldTriggerElection(){
  if(!S.player.clubs.length) return null;
  /* 已经当负责人了不触发 */
  if(S.player.clubRole && S.player.clubRole.role==='负责人') return null;
  /* 只在第 1 周触发 */
  if(S.week !== 1) return null;
  /* 玩家必须大二或大三 */
  const year = Math.ceil(S.semester / 2);
  if(year !== 2 && year !== 3) return null;
  /* 一个学期只触发一次 */
  const key = S.semester * 100 + S.week;
  if(S._lastElectionCheck === key) return null;
  S._lastElectionCheck = key;
  /* 玩家必须是社团成员 */
  const club = pick(S.player.clubs);
  return club;
}

function triggerClubElection(clubName, cb){
  /* 计算玩家在社团的表现 */
  const completed = (S.clubTaskHistory||[]).filter(t=>t.done && t.club===clubName).length;
  const failed = (S.clubTaskHistory||[]).filter(t=>t.failed && t.club===clubName).length;
  const ministerAff = (()=>{
    const m = S.npcs.find(n=>n.role==='社团负责人' && n.club===clubName && n.known);
    return m ? m.aff : 0;
  })();

  /* 成功率：基础 30% + 完成任务 × 10% - 失败任务 × 5% + 负责人好感 / 4 */
  let rate = 30 + completed * 10 - failed * 5 + Math.floor(ministerAff / 4);
  rate = Math.max(5, Math.min(95, rate));

  const body =
    `${clubName} 要换届了。\n\n` +
    `现任负责人找到你：“你这两年做得不错。要不要考虑一下，接这个位子？”\n\n` +

/* 学期回望：每学期期末考试后显示 */
function buildSemesterReview(){
  const sem=S.semester;
  const events=S.events.filter(e=>e.s===sem);
  const npcMeets=events.filter(e=>e.type==='npc').length;
  const loveCount=events.filter(e=>e.type==='love').length;
  const badCount=events.filter(e=>e.type==='bad').length;
  const goodCount=events.filter(e=>e.type==='good').length;

  /* 找出这学期最喜欢/最亲近的人 */
  const known=S.npcs.filter(n=>n.known);
  let bestNpc=null,bestVal=-1;
  known.forEach(n=>{
    const val=n.aff + n.love*1.5;
    if(val>bestVal){bestVal=val;bestNpc=n;}
  });

  const lines=[];
  lines.push(`📅 第 ${sem} 学期结束`);
  lines.push('');
  lines.push(`这学期，你一共经历了 ${events.length} 件事。`);
  if(goodCount)lines.push(`· 让你高兴的：${goodCount} 件`);
  if(badCount) lines.push(`· 让你烦心的：${badCount} 件`);
  if(npcMeets)lines.push(`· 和朋友的来往：${npcMeets} 次`);
  if(loveCount)lines.push(`· 关于恋爱的时刻：${loveCount} 次`);

  if(bestNpc){
    lines.push('');
    if(bestNpc.love>0){
      lines.push(`这学期陪在你身边最多的，是 ${bestNpc.name}。`);
      lines.push(`爱情值 ${bestNpc.love} · 好感 ${bestNpc.aff}`);
    }else{
      lines.push(`这学期最亲近的人，是 ${bestNpc.name}（好感 ${bestNpc.aff}）。`);
    }
  }

  const exam=S.exams.filter(e=>e.sem===sem);
  if(exam.length){
    lines.push('');
    lines.push(`成绩：${exam.map(e=>e.grade).join(' / ')}`);
  }

  return lines.join('\n');
}

function showFarewellThen(cb){
  const known=S.npcs.filter(n=>n.known);

  const lover=S.npcs.find(n=>n.love>0);
  const bestFriends=known.filter(n=>n.aff>=80 && n.id!==(lover?lover.id:-1)).slice(0,3);
  const roommates=known.filter(n=>n.role==='舍友' && n.id!==(lover?lover.id:-1)).slice(0,3);

  const targets=[];
  if(lover)targets.push({npc:lover, type:'lover'});
  bestFriends.forEach(n=>{
    if(!targets.find(t=>t.npc.id===n.id))targets.push({npc:n, type:'friend'});
  });
  roommates.forEach(n=>{
    if(!targets.find(t=>t.npc.id===n.id))targets.push({npc:n, type:'roommate'});
  });

  if(!targets.length){
    /* 谁都不熟，就简单收尾 */
    showModal('🎓 毕业',
      `你一个人走完了这四年。\n\n没有太多人送别，也没有太多人惦记。\n\n收拾行李的时候，你翻出了一些旧东西。\n\n然后你把它们都装进了箱子。`,
      [], ()=>{if(cb)cb();});
    return;
  }

  let idx=0;
  const run=(i)=>{
    if(i>=targets.length){if(cb)cb();return;}
    const t=targets[i];
    const npc=t.npc;
    const pron=getPronoun(npc);

    let title='',body='',changes=[];

    if(t.type==='lover'){
      title=`🎓 和 ${npc.name} 的告别`;
      const loveTier=npc.love>=80?3:(npc.love>=50?2:1);
      if(loveTier===3){
        body=
          `最后一天，${npc.name} 和你一起收拾宿舍。\n\n`+
          `${pron.sub}把你的东西一件件装进箱子，动作很慢。\n\n`+
          `收拾完之后，你们坐在床沿上很久没说话。\n\n`+
          `“以后……”${pron.sub}开了口，又停住。\n\n`+
          `你握住${pron.sub}的手。\n\n`+
          `${pron.sub}靠过来，把脸埋进你肩膀里。\n\n`+
          `“要记得我。”`;
      }else{
        body=
          `最后一天，${npc.name} 来送你。\n\n`+
          `${pron.sub}手上拎着一袋东西，说是路上吃的。\n\n`+
          `你们站在校门口，说了些没头没尾的话。\n\n`+
          `车来的时候，${pron.sub}忽然抱了你一下，很快就松开。\n\n`+
          `“走了。”${pron.sub}说。`;
      }
      changes=[{label:`💗 和 ${npc.name} 告别`,dir:'love'}];
    }else if(t.type==='friend'){
      title=`🎓 和 ${npc.name} 的告别`;
      body=
        `临走前你去找了 ${npc.name}。\n\n`+
        `${pron.sub}正在收拾东西，看到你的时候愣了一下，然后笑了。\n\n`+
        `“就知道你会来。”\n\n`+
        `你们聊了会儿，把这几年的碎事翻了个遍。\n\n`+
        `走的时候，${pron.sub}把一样东西塞给你——不值钱，但你一直留着。`;
      changes=[{label:`💗 和 ${npc.name} 告别`,dir:'up'}];
    }else{
      title=`🎓 和舍友 ${npc.name} 的告别`;
      body=
        `宿舍楼下停着搬家的车。\n\n`+
        `${npc.name} 的箱子已经堆到了门口。\n\n`+
        `${pron.sub}看到你，说：“终于要走了。”\n\n`+
        `你们把宿舍又看了一遍——墙上的贴纸、床头的挂钩、阳台那盆没带走的植物。\n\n`+
        `“以后有空聚。”${pron.sub}说。\n\n`+
        `你点了点头。`;
      changes=[{label:`💗 和 ${npc.name} 告别`,dir:'up'}];
    }

    showModal(title,body,changes,()=>{run(i+1);});
  };
  run(0);
}

/* 检查是否要触发新故事链 / 推进已有故事链 */
function checkStoryChains(cb){
  S._storyChainActive = S._storyChainActive||null;
  S._storyChainHistory = S._storyChainHistory||[];

  /* 有进行中的故事链：判断是否推进 */
  if(S._storyChainActive){
    const info=S._storyChainActive;
    const chain=STORY_CHAINS.find(c=>c.id===info.id);
    if(!chain){
      S._storyChainActive=null;
    }else{
      const currAbs=S.semester*16+S.week;
      const lastAbs=info.lastAbs||currAbs;
      const nextStage=info.stage+1;
      if(nextStage>=chain.totalStages){
        /* 已完成所有阶段 */
        S._storyChainActive=null;
      }else if(currAbs-lastAbs>=chain.interval){
        /* 推进到下一阶段 */
        info.stage=nextStage;
        info.lastAbs=currAbs;
        const stage=chain.stages[nextStage];
        const before=snapshot();
        showModal(stage.title,stage.body,stage.changes||[],()=>{
          if(stage.onOk)stage.onOk();
          const after=snapshot();
          if(cb)cb();
        });
        return;
      }
    }
  }

  /* 没有进行中的：随机开启一个新故事链 */
  if(!S._storyChainActive){
    const used=S._storyChainHistory;
    const available=STORY_CHAINS.filter(c=>!used.includes(c.id));
    if(available.length && Math.random()<0.06){
      const chain=pick(available);
      S._storyChainActive={
        id:chain.id,
        stage:0,
        lastAbs:S.semester*16+S.week
      };
      S._storyChainHistory.push(chain.id);
      const stage=chain.stages[0];
      setTimeout(()=>{
        showModal(stage.title,stage.body,stage.changes||[],()=>{
          if(stage.onOk)stage.onOk();
          if(cb)cb();
        });
      },300);
      return;
    }
  }

  if(cb)cb();
}

/* ===== 传说事件触发 ===== */
function tryLegendEvent(){
  const used=S.legendHistory||[];
  const available=LEGEND_EVENTS.filter(e=>!used.includes(e.id));
  if(!available.length) return null;
  /* 每学期最多触发 1 个传说 */
  const semKey='legend_sem_'+S.semester;
  if(S[semKey]) return null;
  /* 概率：每学期约 30%，但随机检查发生在每周 */
  if(Math.random()>0.08) return null;
  /* 找出当前符合条件的 */
  const eligible=available.filter(e=>{
    try{ return e.cond(); }catch(err){ return false; }
  });
  if(!eligible.length) return null;
  const ev=pick(eligible);
  S[semKey]=true;
  return ev;
}

function showLegendEvent(ev, cb){
  if(!ev){ if(cb)cb(); return; }
  const r=ev.build();
  if(!r){ if(cb)cb(); return; }

  S.legendHistory=S.legendHistory||[];
  S.legendHistory.push(ev.id);
  if(!S.codexLegends)S.codexLegends=[];
  S.codexLegends.push(ev.id);

  showModal(r.title, r.body, r.changes||[], ()=>{
    if(r.onOk) r.onOk();
    if(cb) cb();
  });
}

const FRICTION_REPLY_DEFAULT=[
  '{n} 沉默了一会儿。',
  '{n} 看了你一眼，没有说话。'
];function triggerFriction(npc,cb){
  const pron=getPronoun(npc);
  const chem=chemistry(S.player.personality,npc.person);
  let drop;
  if(chem>=1) drop=rnd(2,4);
  else if(chem<=-2) drop=rnd(7,12);
  else if(chem<0) drop=rnd(5,8);
  else drop=rnd(3,6);
  if(S.player.personality==='毒舌')drop+=2;
  if(S.player.personality==='热心')drop-=1;
  if(S.player.personality==='高冷')drop+=1;
  if(S.player.personality==='开朗')drop-=1;
  if(npc.person==='毒舌')drop+=1;
  if(npc.person==='温柔')drop-=1;
  if(npc.person==='热心')drop-=1;
  if(npc.person==='感性')drop+=1;
  drop=Math.max(1,drop);

  const affBefore=npc.aff;
  npc.aff=clamp(npc.aff-drop,0,100);
  const real=affBefore-npc.aff;

  const scene=pick(FRICTION_SCENES)
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub);
  const replyPool=FRICTION_REPLY[npc.person]||FRICTION_REPLY_DEFAULT;
  const reply=pick(replyPool)
    .replace(/\{n\}/g,npc.name)
    .replace(/\{pr\}/g,pron.sub);

  const body=`${scene}\n\n${reply}`;
  addEvent(`💢 你和 ${npc.name} 之间发生了一点小摩擦，好感度 -${real}。`,'bad');

  showModal('💢 一点摩擦',body,[{label:`${npc.name} 好感 -${real}`,dir:'down'}],()=>{if(cb)cb();});
}

function generateNpcRelationships(npcs){
  npcs.forEach(n=>{n.relations={};});
  const byClub={};
  const byMajor={};
  npcs.forEach(n=>{
    if(n.club){
      if(!byClub[n.club])byClub[n.club]=[];
      byClub[n.club].push(n);
    }
    if(!byMajor[n.major])byMajor[n.major]=[];
    byMajor[n.major].push(n);
  });
  Object.keys(byClub).forEach(c=>{
    const arr=byClub[c];
    for(let i=0;i<arr.length-1;i++){
      const a=arr[i],b=arr[i+1];
      if(a.id!==b.id){
        a.relations[b.id]='同社团';
        b.relations[a.id]='同社团';
      }
    }
  });
  Object.keys(byMajor).forEach(m=>{
    const arr=byMajor[m].slice(0,5);
    for(let i=0;i<arr.length-1;i++){
      const a=arr[i],b=arr[i+1];
      if(a.id!==b.id && !a.relations[b.id]){
        a.relations[b.id]='同学';
        b.relations[a.id]='同学';
      }
    }
  });
  npcs.forEach(n=>{
    if(Object.keys(n.relations).length>=3)return;
    const cands=npcs.filter(x=>x.id!==n.id && !n.relations[x.id]).slice(0,30);
    if(cands.length){
      const extra=pick(cands);
      const t=pick(['朋友','老乡','高中同学','表亲']);
      n.relations[extra.id]=t;
      extra.relations[n.id]=t;
    }
  });
}

function chemistry(p1,p2){
  const pairs={
    '温和|开朗':1,'温和|内向':1,'温和|毒舌':0,'温和|理性':1,'温和|感性':1,'温和|热心':2,'温和|高冷':1,
    '开朗|内向':0,'开朗|毒舌':-1,'开朗|理性':0,'开朗|感性':2,'开朗|热心':2,'开朗|高冷':-1,
    '内向|毒舌':-1,'内向|理性':1,'内向|感性':1,'内向|热心':0,'内向|高冷':0,
    '毒舌|理性':0,'毒舌|感性':-1,'毒舌|热心':0,'毒舌|高冷':1,
    '理性|感性':0,'理性|热心':1,'理性|高冷':2,
    '感性|热心':2,'感性|高冷':-1,'热心|高冷':-1
  };
  const k1=p1+'|'+p2,k2=p2+'|'+p1;
  if(pairs[k1]!==undefined)return pairs[k1];
  if(pairs[k2]!==undefined)return pairs[k2];
  return 0;
}

function diffStats(before,after){
  const out=[];
  const baseKeys=['外貌','智力','情商','体质','才艺','运气'];
  const skillKeys=['学术','艺术','体育','社交','实践'];
  baseKeys.forEach(k=>{
    const d=after.base[k]-before.base[k];
    if(d!==0)out.push({label:`${k} ${d>0?'+':''}${d}`,dir:d>0?'up':'down'});
  });
  skillKeys.forEach(k=>{
    const d=after.skills[k]-before.skills[k];
    if(d!==0)out.push({label:`${k} ${d>0?'+':''}${d}`,dir:d>0?'up':'down'});
  });
  const dp=after.prog-before.prog;
  if(dp!==0)out.push({label:`学习进程 ${dp>0?'+':''}${dp}`,dir:dp>0?'up':'down'});
  const de=after.energy-before.energy;
  if(de!==0)out.push({label:`精力 ${de>0?'+':''}${de}`,dir:de>0?'up':'down'});
  const dm=after.mood-before.mood;
  if(dm!==0)out.push({label:`心情 ${dm>0?'+':''}${dm}`,dir:dm>0?'up':'down'});
  const dmo=after.money-before.money;
  if(dmo!==0)out.push({label:`金钱 ${dmo>0?'+':''}${dmo}`,dir:dmo>0?'up':'down'});
  return out;
}

function checkAchievements(){
  if(_isCheckingAchievements) return [];
  _isCheckingAchievements = true;
  
  const newlyUnlocked=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!S.achievements.includes(a.id)){
      try{
        if(a.check()){
          S.achievements.push(a.id);
          newlyUnlocked.push(a);
        }
      }catch(e){}
    }
  });
  
  _isCheckingAchievements = false;
  
  if(newlyUnlocked.length > 0){
    // 记录到事件日志
    newlyUnlocked.forEach(a=>addEvent(`🏆 成就解锁：${a.icon} ${a.name}`,'good'));
    
    // 依次弹窗提示（延迟一点，防止覆盖当前画面）
    setTimeout(() => {
      newlyUnlocked.forEach((a, idx) => {
        setTimeout(() => {
          // 如果此时屏幕上还有其他弹窗，就不强行弹（比如在结局界面），直接跳过
          const hasModal = document.querySelector('.modal-wrap');
          if(!hasModal){
            showModal(`🏆 成就解锁`, `【${a.icon} ${a.name}】\n\n${a.desc}`, [{label:'太棒了！', dir:'love'}]);
          }
        }, idx * 1200);
      });
    }, 500);
  }
  
  return newlyUnlocked;
}

function clearAllModals(){
  try{
    document.querySelectorAll('.modal-wrap').forEach(el=>el.remove());
  }catch(e){}
}
function showModal(title,body,changes,cb,btnText){
  clearAllModals();
  changes=changes||[];
  const safeTitle=escapeHtml(title);
  const safeBody=escapeHtml(body).replace(/\n/g,'<br>');
  const chHTML=changes.length
    ? `<div class="modal-changes">${changes.map(c=>
        `<span class="chg ${c.dir||'up'}">${escapeHtml(c.label||'')}</span>`
      ).join('')}</div>`
    : '';
  const wrap=document.createElement('div');
  wrap.className='modal-wrap';
  wrap.innerHTML=`
    <div class="modal-box">
      <div class="modal-title">${safeTitle}</div>
      <div class="modal-body">${safeBody}</div>
      ${chHTML}
      <button class="btn" style="width:100%" id="modalOkBtn">${escapeHtml(btnText||'确定')}</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#modalOkBtn').onclick=()=>{
    wrap.remove();
    if(cb)cb();
    render();
  };
}

function showChoice(title,body,choices,cb,isVertical){
  clearAllModals();
  const safeTitle=escapeHtml(title);
  const safeBody=escapeHtml(body).replace(/\n/g,'<br>');
  const wrap=document.createElement('div');
  wrap.className='modal-wrap';
  
  let choiceHTML = '';
  if (isVertical) {
    // 竖向排列（撑满宽度，带间距）
    choiceHTML = `<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
      ${choices.map((c,i)=>`<button class="btn ${c.cls||''}" data-choice="${i}" style="width:100%">${escapeHtml(c.label)}</button>`).join('')}
    </div>`;
  } else {
    // 横向排列（恢复原版）
    choiceHTML = `<div class="row" style="margin-top:6px">
      ${choices.map((c,i)=>`<button class="btn ${c.cls||''}" data-choice="${i}" style="flex:1">${escapeHtml(c.label)}</button>`).join('')}
    </div>`;
  }

  wrap.innerHTML=`
    <div class="modal-box">
      <div class="modal-title">${safeTitle}</div>
      <div class="modal-body">${safeBody}</div>
      ${choiceHTML}
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-choice]').forEach(b=>{
    b.onclick=()=>{
      const i=Number(b.dataset.choice);
      wrap.remove();
      if(cb)cb(choices[i].value);
      render();
    };
  });
}

/* ===== NPC 记忆系统 ===== */
function addMemory(npc, text, type){
  if(!npc)return;
  if(!npc.memory)npc.memory=[];
  /* 同一周同类型不重复添加 */
  const last=npc.memory[0];
  if(last && last.text===text && last.week===S.week && last.sem===S.semester)return;
  npc.memory.unshift({
    text: text,
    type: type||'chat',
    sem: S.semester,
    week: S.week,
    abs: currentAbsWeek()
  });
  if(npc.memory.length>12)npc.memory.pop();
}

/* 从记忆里挑一条适合"被 NPC 主动提起"的 */
function pickReciteMemory(npc){
  if(!npc || !npc.memory || !npc.memory.length)return null;
  /* 只挑聊天/送礼/约会/外出/剧情这几类，不挑系统类 */
  const pool=npc.memory.filter(m=>['chat','gift','out','date','story','social'].includes(m.type));
  if(!pool.length)return null;
  /* 优先挑 8 周以前的，避免刚发生就立刻提起 */
  const curr=currentAbsWeek();
  const old=pool.filter(m=>curr-m.abs>=4);
  return old.length?pick(old):pick(pool);
}

function reciteMemoryLine(npc, mem){
  const pron=getPronoun(npc);
  const days=currentAbsWeek()-mem.abs;
  const when = days<8?'前阵子' : (days<20?'一个多月前' : '刚开学那会儿');
  const lines=[
    `聊着聊着，${npc.name} 忽然说：\n\n“${when}……${mem.text}。我一直记得。”`,
    `${npc.name} 忽然提起以前的事：\n\n“你还记得吗？${mem.text}”`,
    `“说起来，”${npc.name} 顿了一下，“${mem.text}，我到现在都还记得。”`,
    `${npc.name} 看着你，像是想起了什么：\n\n“${mem.text}。那次之后我一直在想。”`
  ];
  return pick(lines);
}
/* ===== 年级 / 毕业系统 ===== */
const STUDENT_ROLES = ['同学','其他学生','舍友','社团成员','社团负责人','邻校交流生','夜跑常客','已毕业校友'];

/* 返回 0=非学生, 1~4=大一~大四, 5=已毕业 */
/* 返回 -1=还没入学, 0=非学生, 1~4=大一~大四, 5=已毕业 */
function npcGradeNum(npc){
  if(!npc.isStudent) return 0;
  if(npc.role === '已毕业校友') return 5;
  
  // 👇 核心修复：如果当前处于假期，实际时间已经算到了下学期，避免 NPC 留级
  let currentSem = S.semester;
  if(S.phase === 'vacation') currentSem++;
  
  const absSem = currentSem + (npc.gradeOffset || 0) * 2;
  if(absSem > 8) return 5;
  if(absSem <= 0) return -1;
  return Math.ceil(absSem / 2);
}

function npcGradeLabel(npc){
  if(!npc.isStudent) return '';
  const g = npcGradeNum(npc);
  if(g === -1) return '';
  if(g >= 5) return '已毕业';
  
  let label = ['','大一','大二','大三','大四'][g];
  
  // 👇 根据性别区分单人称谓
  const offset = npc.gradeOffset || 0;
  const isMale = npc.gender === '男';
  
  if (npc.role === '舍友' || offset === 0) {
    label += '·同级';
  } else if (offset > 0) {
    label += isMale ? '·学长' : '·学姐';
  } else if (offset < 0) {
    label += isMale ? '·学弟' : '·学妹';
  }
  return label;
}

function isNpcGraduated(npc){
  if(!npc.isStudent) return false;
  return npcGradeNum(npc) >= 5;
}

function settleCompetition(cb){
  const comp=S.activeComp;
  if(!comp){if(cb)cb();return;}
  const p=S.player;
  const skillKey=comp.skill||'学术';
  const skillVal=p.skills[skillKey]||0;
  const baseSkill=(p.base.智力+p.base.情商+p.base.体质+p.base.才艺)/4;
  const score=comp.prepValue*0.7+skillVal*0.5+baseSkill*0.2+rnd(0,20);
  const th={1:{g:80,s:60,x:40},2:{g:100,s:75,x:50},3:{g:120,s:90,x:60}}[comp.diff]||{g:100,s:75,x:50};
  let award;
  if(score>=th.g)award='国奖';
  else if(score>=th.s)award='省奖';
  else if(score>=th.x)award='校奖';
  else award='无奖';

  S.compHistory.push({n:comp.n,award:award,sem:comp.startSem,score:Math.round(score)});
  addEvent(`🏅 「${comp.n}」结果：${award}（得分${Math.round(score)}）。`,award==='无奖'?'bad':'good');

  const changes=[];
  let money=0;
  /* ===== 奖金翻倍（第13项）===== */
  if(award==='国奖'){changes.push({label:'🏆 国奖',dir:'love'});p.base.智力=clamp(p.base.智力+3,0,100);S.mood=100;money=5000;}
  else if(award==='省奖'){changes.push({label:'🥈 省奖',dir:'up'});p.base.智力=clamp(p.base.智力+2,0,100);S.mood=clamp(S.mood+15,0,100);money=2000;}
  else if(award==='校奖'){changes.push({label:'🥉 校奖',dir:'up'});S.mood=clamp(S.mood+8,0,100);money=800;}
  else {changes.push({label:'无奖',dir:'down'});S.mood=clamp(S.mood-8,0,100);}
  if(money>0){addMoney(money);changes.push({label:`奖金 +${money}`,dir:'money'});}

  const body=`「${comp.n}」\n\n${comp.desc}\n\n难度：${['','★','★★','★★★'][comp.diff]}\n准备值：${comp.prepValue}\n最终得分：${Math.round(score)}\n\n🏆 获得：${award}${money>0?`\n💰 奖金：${money}`:''}`;
  S.activeComp=null;
  showModal('🏅 竞赛结果',body,changes,()=>{if(cb)cb();});
}

/* ===== 毕业去向判定：找出所有满足的，并让玩家自选 ===== */
function getAvailableCareers(){
  const list = [];
  for(const path of CAREER_PATHS){
    try{
      if(path.condition()) list.push(path);
    }catch(e){}
  }
  /* 至少保留一个保底去向 */
  if(list.length === 0) list.push(CAREER_PATHS[CAREER_PATHS.length-1]);
  return list;
}

function openCareerChoice(cb){
  const available = getAvailableCareers();
  const old = document.querySelector('.modal-wrap');
  if(old) old.remove();
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">🎓 选择毕业去向</div>
      <div class="modal-body" style="line-height:1.7">
        四年的大学生活结束了。<br>
        回顾这四年的经历，你已经达到了以下去向的条件。<br>
        请选择你未来的道路：
      </div>
      <div style="max-height:42vh;overflow-y:auto;margin-bottom:12px">
        ${available.map(c => `
          <div data-career="${c.id}" style="cursor:pointer;padding:11px 13px;border:1.5px solid #eef5f9;border-radius:12px;margin-bottom:8px;background:#fff;transition:.15s">
            <div style="font-weight:700;color:#20536b;font-size:14px">${c.icon} ${c.name}</div>
            <div class="mini" style="margin-top:3px">${c.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  document.body.appendChild(wrap);
  
  wrap.querySelectorAll('[data-career]').forEach(el => {
    el.onclick = () => {
      const career = available.find(x => x.id === el.dataset.career);
      if(!career) return;
      /* 记录玩家选择的去向 */
      S.career = career;
      if(!S.codexEndings.includes(S.career.id)) S.codexEndings.push(S.career.id);
      wrap.remove();
      if(cb) cb();
    };
  });
}

function doExam(){
  // 👇 新增：防止在同一学期、同一周重复结算考试
  if (S.exams.some(e => e.sem === S.semester && e.week === S.week)) {
    return;
  }
  
  const p=S.player;
  /* 平时分加成：最高 +25 */
  const hwBonus=(S.homeworkScore||0)*0.25;
  const raw=p.base.智力*0.9+p.skills.学术*1.4+S.studyProgress*0.7+rnd(0,25)+rnd(-8,8)+hwBonus;
  let g,pt;
  if(raw>=165){g='A';pt=4;}
  else if(raw>=130){g='B';pt=3;}
  else if(raw>=95){g='C';pt=2;}
  else{g='D';pt=1;}
  const isMid=S.week===8;
const label=isMid?'期中考试':'期末考试';
S.exams.push({sem:S.semester,week:S.week,grade:g,pt});
addEvent(`📝 第${S.semester}学期 ${label}结束，你拿到了【${g}】等成绩。`,'exam');

/* ===== 奖学金（仅期末，按平均绩点结算） ===== */
if(!isMid){
  const avg=avgGPA();
  let money=0, name='';
  if(avg>=3.7){money=2500;name='一等奖学金';}
  else if(avg>=3.3){money=1500;name='二等奖学金';}
  else if(avg>=2.8){money=800;name='三等奖学金';}
  else if(avg>=2.3){money=300;name='鼓励奖学金';}
  if(money>0){
    addMoney(money);
    S.mood=clamp(S.mood+10,0,100);
    addEvent(`🏆 你获得了${name}（+${money}元）。`,'money');
  }
}
  /* 平时分影响成绩：优秀加分，危险扣分 */
  if((S.homeworkScore||0)>=80){
    addEvent(`📝 平时分优异（${S.homeworkScore}），老师给了一点印象分。`,'good');
  }else if((S.homeworkScore||0)<40){
    addEvent(`📝 平时分偏低（${S.homeworkScore}），老师提醒你注意。`,'bad');
  }

  if(g==='A'){
    S.mood=clamp(S.mood+12,0,100);
    addEvent('老师在全班面前表扬了你，心情不错。','good');
  }
  if(g==='D'){
    S.mood=clamp(S.mood-12,0,100);
    addEvent('成绩不太理想，你有些沮丧。','bad');
  }
  if(!isMid)S.studyProgress=0;

  /* 期末考试后平时分重置到 60（新学期重新算） */
  if(!isMid)S.homeworkScore=60;

  /* 考试周专属：考完当晚庆祝 */
// 期末：从 CELEBRATE_SCENES 和 POST_EXAM_SCENES 里各抽一句拼接
// 期中：继续用 CELEBRATE_SCENES_MID
const celebrate = isMid
  ? pick(CELEBRATE_SCENES_MID)
  : (pick(CELEBRATE_SCENES) + '\n\n' + pick(POST_EXAM_SCENES));
S._examCelebration={
  grade:g,
  isMid:isMid,
  label:label,
  celebrate:celebrate,
  closer: isMid ? pick(MID_EXAM_CLOSERS) : pick(FINAL_EXAM_CLOSERS)
};
  S.mood=clamp(S.mood+10,0,100);

  return{grade:g,isMid:isMid,label:label};
}

function triggerPlaceEvent(place){
  const pool = PLACE_EVENTS[place];
  if(!pool || !pool.length) return '';
  const text = pick(pool);
  // 20% 概率附带一个小数值变化
  if(Math.random()<0.2){
    S.mood = clamp(S.mood + 2, 0, 100);
  }
  return text;
}

function maybeMini(){
  if(Math.random()<0.22){
    if(!S._recentMiniEvents) S._recentMiniEvents = [];
    
    let availableIndices = [];
    for(let i=0; i<MINI.length; i++){
      if(!S._recentMiniEvents.includes(i)) availableIndices.push(i);
    }
    
    // 如果小事件全看过了，清空冷却池
    if(!availableIndices.length) {
      S._recentMiniEvents = [];
      for(let i=0; i<MINI.length; i++) availableIndices.push(i);
    }
    
    const idx = pick(availableIndices);
    S._recentMiniEvents.push(idx);
    if(S._recentMiniEvents.length > 10) S._recentMiniEvents.shift(); // 最多记住最近10个
    
    const r = MINI[idx]();
    addEvent(r.t, r.c);
    return r.t;
  }
  return null;
}

const before=snapshot();
S.ap--;

// ===== 地点专属小事件：8% 概率触发 =====
let placeEvent='';
if(Math.random()<0.08){
  placeEvent=triggerPlaceEvent(S.openPlace);
}

const eff=weatherEffect(S.openPlace,id);
  if(eff.skillMul!==1){
    ['学术','艺术','体育','社交','实践'].forEach(k=>{
      const d=S.player.skills[k]-before.skills[k];
      if(d>0){
        const nd=Math.max(1,Math.round(d*eff.skillMul));
        S.player.skills[k]=clamp(before.skills[k]+nd,0,100);
      }
    });
  }
  if(eff.moodDelta)  S.mood  =clamp(S.mood  +eff.moodDelta,  0,100);
  if(eff.energyDelta)S.energy=clamp(S.energy+eff.energyDelta,0,100);

  addEvent(txt,'act');
  const extras=[];
  const m1=maybeMini();if(m1)extras.push(m1);
  S.energy=clamp(S.energy,0,100);
  S.mood=clamp(S.mood,0,100);
  const after=snapshot();
  const changes=diffStats(before,after);
  const baseBody=txt+(eff.note||'')+(placeEvent?'\n\n'+placeEvent:'');
  const fullBody=extras.length?baseBody+'\n\n'+extras.join('\n\n'):baseBody;

}

function doCompPrepare(){
  if(!S.activeComp){
    gotoScene('🏅 暂无竞赛','你当前没有报名任何竞赛。',[]);
    return;
  }
  if(S.ap<=0){
    gotoScene('⏰ 行动点用完了','本周的行动点已经用完。',[]);
    return;
  }
  const comp=S.activeComp;
  S.ap--;
  const before=snapshot();
  const skillKey=comp.skill||'学术';
  const gain=rnd(8,15)+Math.floor((S.player.skills[skillKey]||0)/20);
  const realGain=Math.max(0,Math.min(gain,100-comp.prepValue));
  comp.prepValue=clamp(comp.prepValue+realGain,0,100);

function settleCampusEvent(cb){
  const ev=getActiveEvent();
  if(!ev){if(cb)cb();return;}
  const p=S.player;
  const skillKey=ev.skill||'社交';
  const skillVal=p.skills[skillKey]||0;
  const baseVal=(p.base[ev.base[0]]+p.base[ev.base[1]])/2;
  const score=Math.round(
    S.activeCampusEvent.prepValue*0.6 +
    skillVal*0.6 +
    baseVal*0.3 +
    rnd(0,25)
  );

  /* 评级 */
  let rank, rankIcon, rankColor;
  if(score>=140){rank='冠军'; rankIcon='🥇'; rankColor='love';}
  else if(score>=110){rank='亚军'; rankIcon='🥈'; rankColor='up';}
  else if(score>=80){rank='季军'; rankIcon='🥉'; rankColor='up';}
  else if(score>=50){rank='进决赛'; rankIcon='🎖️'; rankColor='up';}
  else {rank='未入围'; rankIcon='😮‍💨'; rankColor='down';}

  /* 奖励 */
  let money=0;
  let skillReward=0;
  let moodDelta=0;
  let affBonus=0;
  if(rank==='冠军'){money=1500;skillReward=5;moodDelta=25;affBonus=8;}
  else if(rank==='亚军'){money=800;skillReward=3;moodDelta=18;affBonus=5;}
  else if(rank==='季军'){money=400;skillReward=2;moodDelta=12;affBonus=3;}
  else if(rank==='进决赛'){money=100;skillReward=1;moodDelta=5;affBonus=1;}
  else {money=0;skillReward=0;moodDelta=-8;affBonus=0;}

  if(money>0)addMoney(money);
  if(skillReward>0)addSkill(skillKey,skillReward);
  if(moodDelta)S.mood=clamp(S.mood+moodDelta,0,100);

  /* 好感：给参与过的 NPC 一点额外加成 */
  const related=S.npcs.filter(n=>n.known);
  if(related.length && affBonus>0){
    const fans=[...related].sort((a,b)=>b.aff-a.aff).slice(0,3);
    fans.forEach(n=>{ n.aff=clamp(n.aff+affBonus,0,100); });
  }

  /* 记录历史 */
  S.campusEventHistory=S.campusEventHistory||[];
  S.campusEventHistory.push({
    id:ev.id,
    name:ev.name,
    rank,
    score,
    sem:S.semester,
    week:S.week
  });
  S._campusEventDone=S._campusEventDone||[];
  S._campusEventDone.push(ev.id);

  addEvent(`🎪 「${ev.name}」结果：${rank}（得分 ${score}）。`,
    rank==='未入围'?'bad':'good');

  // 生成不同的情绪文案
let moodText = '';
if(rank === '冠军'){
  moodText = `当主持人念出你的名字时，全场响起了雷鸣般的掌声。\n\n灯光打在你的身上，你站在舞台中央，心里有一种说不出的不真实感。\n\n这段时间的汗水、焦虑和反复练习，在这一刻全都值了。`;
} else if(rank === '亚军' || rank === '季军'){
  moodText = `成绩公布的那一刻，你深深呼出了一口气。\n\n虽然离最高领奖台只有一步之遥，但看着台下为你鼓掌的人，你觉得这个过程本身，已经足够精彩。`;

function openHomeworkPanel(){

function resolveHomework(v){
  const hw=S.homework;
  if(!hw || hw.done)return;
  if(S.ap<=0)return;
  if(v==='buy' && (S.money||0)<60){
    showModal('💸 钱不够','找人代写至少要 60 元。\n\n你还是自己写吧。',[]);
    return;
  }

  const before=snapshot();
  S.ap--;

  let scoreDelta=0;
  let body='';
  let energyDelta=0;
  let moodDelta=0;
  let moneyDelta=0;
  let progDelta=0;

  if(v==='serious'){
    scoreDelta=4;
    progDelta=hw.baseProg+2;
    energyDelta=-10;
    moodDelta=-3;
    body=`你坐在自习室，认认真真地写这份【${hw.type}】。\n\n${hw.desc}\n\n写完的时候手都酸了，但心里踏实。`;
    addEvent(`📝 你认真完成了「${hw.type}」，平时分 +4。`,'good');
  }else if(v==='quick'){
    scoreDelta=2;
    progDelta=hw.baseProg;
    energyDelta=-5;
    body=`你花了一个小时，把这份【${hw.type}】随便写了写。\n\n${hw.desc}\n\n能交差就行。`;
    addEvent(`📝 你随便写完了「${hw.type}」，平时分 +2。`,'act');
  }else if(v==='buy'){
  scoreDelta=3;
  energyDelta=-2;
  moneyDelta=-60;
  progDelta=2;
  body=`你花了 60 块钱，找了一位学长帮你辅导了这份作业。\n\n他给你讲了一遍思路，你自己动手写完了。\n\n虽然花了钱，但确实学到了东西。`;
  addEvent(`📝 你花钱请人辅导，完成了「${hw.type}」，平时分 +3。`,'money');
}

  hw.done=true;
  hw.quality=v;
  S.homeworkScore=clamp(S.homeworkScore+scoreDelta,0,100);
  addProg(progDelta);
  S.energy=clamp(S.energy+energyDelta,0,100);
  S.mood=clamp(S.mood+moodDelta,0,100);
  if(moneyDelta)addMoney(moneyDelta);

  S.homeworkHistory=S.homeworkHistory||[];
  S.homeworkHistory.push({
    type:hw.type,
    quality:v,
    sem:S.semester,
    week:S.week,
    score:scoreDelta
  });

  const after=snapshot();
  const changes=diffStats(before,after);
  changes.push({label:`平时分 ${scoreDelta>=0?'+':''}${scoreDelta}`,dir:scoreDelta>=0?'up':'down'});

  gotoScene(`📝 写作业 · ${hw.type}`,body,changes);
